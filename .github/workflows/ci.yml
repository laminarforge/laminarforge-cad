name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: laminarforge-cad

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice -v

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build --release
        run: cargo build --release

      - name: LAMP Rev A materialize KiCad board
        run: cargo run --release --bin lamp_rev_a_materialize_board

      - name: LAMP Rev A electrical validation
        run: cargo run --release --bin lamp_rev_a_electrical_validate

      - name: LAMP Rev A SPICE checks
        run: cargo run --release --bin lamp_rev_a_spice_check

      - name: LAMP Rev A PCBA contract check
        run: cargo run --release --bin lamp_pcba_check

      - name: LAMP Rev A fab preview export
        run: cargo run --release --bin lamp_rev_a_fab_preview

      - name: cargo test --release
        run: cargo test --release

  lamp-rev-a-fab-release:
    name: LAMP Rev A fab release
    runs-on: macos-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: laminarforge-cad-fab-release

      - name: Install KiCad CLI and ngspice
        shell: bash
        run: |
          kicad_cli="/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli"
          if [ ! -x "$kicad_cli" ]; then
            brew install --cask kicad
          fi
          if [ ! -x "$kicad_cli" ]; then
            echo "kicad-cli not found at $kicad_cli after Homebrew install" >&2
            exit 1
          fi
          echo "$(dirname "$kicad_cli")" >> "$GITHUB_PATH"
          "$kicad_cli" --version
          if ! command -v ngspice >/dev/null 2>&1; then
            brew install ngspice
          fi
          ngspice -v

      - name: Generate LAMP Rev A fab release
        run: cargo run --release --bin lamp_rev_a_fab_release

      - name: Run LAMP Rev A release SPICE checks
        run: |
          cargo run --release --bin lamp_rev_a_spice_check -- operating-point \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_power_path.spice \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_power_path.ngspice.log
          cargo run --release --bin lamp_rev_a_spice_check -- heater-pwm-transient \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_heater_pwm_transient.spice \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_heater_pwm_transient.ngspice.log
          cargo run --release --bin lamp_rev_a_spice_check -- rail-load-step \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_rail_load_step.spice \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_rail_load_step.ngspice.log
          cargo run --release --bin lamp_rev_a_spice_check -- analog-front-end \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_analog_front_end.spice \
            pcb/lamp_rev_a/fab_release/review/lamp_rev_a_analog_front_end.ngspice.log

      - name: Validate LAMP Rev A upload bundles
        shell: bash
        run: |
          release_dir="pcb/lamp_rev_a/fab_release"
          test -s "$release_dir/release_manifest.txt"
          test -s "$release_dir/review/upload_bundle_checksums.sha256"
          test -s "$release_dir/bundles/lamp_rev_a_jlcpcb_fabrication.zip"
          test -s "$release_dir/bundles/lamp_rev_a_jlcpcb_assembly.zip"
          test -s "$release_dir/bundles/lamp_rev_a_review_package.zip"
          test -s "$release_dir/bundles/lamp_rev_a_source_snapshot.zip"
          test -s "$release_dir/review/electrical_validation.md"
          test -s "$release_dir/review/electrical_validation_gates.csv"
          test -s "$release_dir/review/lamp_rev_a_power_path.spice"
          test -s "$release_dir/review/lamp_rev_a_power_path.ngspice.log"
          test -s "$release_dir/review/lamp_rev_a_heater_pwm_transient.spice"
          test -s "$release_dir/review/lamp_rev_a_heater_pwm_transient.ngspice.log"
          test -s "$release_dir/review/heater_pwm_transient_simulation.csv"
          test -s "$release_dir/review/heater_thermal_transient_simulation.csv"
          test -s "$release_dir/review/usb_inrush_startup_simulation.csv"
          test -s "$release_dir/review/lamp_rev_a_rail_load_step.spice"
          test -s "$release_dir/review/lamp_rev_a_rail_load_step.ngspice.log"
          test -s "$release_dir/review/rail_load_step_simulation.csv"
          test -s "$release_dir/review/lamp_rev_a_analog_front_end.spice"
          test -s "$release_dir/review/lamp_rev_a_analog_front_end.ngspice.log"
          test -s "$release_dir/review/analog_front_end_simulation.csv"
          test -s "$release_dir/review/simulation_handoff.md"
          (cd "$release_dir" && shasum -a 256 -c review/upload_bundle_checksums.sha256)

      - name: Upload LAMP Rev A fab release
        uses: actions/upload-artifact@v4
        with:
          name: lamp-rev-a-pcba-fab-release-${{ github.sha }}
          path: pcb/lamp_rev_a/fab_release
          if-no-files-found: error
