[package]
name = "laminarforge-cad"
version = "0.1.0"
edition = "2021"

[dependencies]
vcad = "0.1"
opencascade = { version = "0.2", optional = true }
glam = "0.23"

[features]
step = ["opencascade"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "laminarforge_cad"
path = "src/lib.rs"

[[bin]]
name = "tube_holder"
path = "src/bin/tube_holder.rs"


