[package]
name = "laminarforge-cad"
version = "0.1.0"
edition = "2021"

[dependencies]
vcad = "0.1"
opencascade = { version = "0.2", optional = true }
glam = "0.23"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
csv = "1.3"
sha2 = "0.10"
statrs = "0.17"
toml = "0.8"
zip = { version = "2", default-features = false }

[features]
step = ["opencascade"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lib]
name = "laminarforge_cad"
path = "src/lib.rs"

[[bin]]
name = "tube_holder"
path = "src/bin/tube_holder.rs"


