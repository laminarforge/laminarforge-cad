[package]
name = "lamp_rev_b_controller_power"
ticket = "T-4C206871"
revision = "Rev B prototype"
source_artifact = "A-8633FB3D"

[topology]
input_mode = "external current-limited 12 V default; 24 V option remains blocked unless protection, MOSFETs, capacitors, connectors, and VDRV regulator population are rated"
usb_role = "USB-C UFP/device only; never powers heater"
heater_power_source = "VIN_HEATER through protection, cutoff loop, and low-side MOSFET channels"
logic_power_source = "P7805-2000-S from VIN_PROTECTED creates +5V, then AP63203WU-7 from +5V creates +3V3"
analog_power_source = "filtered +3V3_ANA branch for ADS1115/mux/dividers"
gate_driver_rail = "VDRV is 12 V-only in the first-article population; 24 V builds require DNP direct-VIN path and optional P7812-500R or equivalent approved 12 V regulator"
usb_logic_bringup = "USB may power logic only through explicit debug jumper/power-mux option"

[five_v_buck]
mpn = "P7805-2000-S"
manufacturer = "CUI/Bel Power"
lcsc_part = "C2848816"
digikey = "11569191"
input = "VIN_PROTECTED, 8-36 V module rating"
output = "+5V, 5 V / 2 A"
assembly = "hand-place/manual THT module, no substitution for prototype release"

[three_v_three_buck]
mpn = "AP63203WU-7"
manufacturer = "Diodes Incorporated"
lcsc_part = "C780769"
digikey = "9858426"
input = "+5V"
output = "+3V3, 3.3 V / 2 A capable against 800 mA board contract"
inductor = "Wurth 74439346068, JLC C2041388, 6.8 uH shielded power inductor"
support_passives = ["100 nF BST-SW bootstrap capacitor", "local +5V input capacitor", "two local +3V3 output capacitors"]

[vdrv_population]
default = "12 V-only direct driver rail population"
twenty_four_v_rule = "Direct VIN-to-VDRV is DNP/blocked for 24 V input."
optional_regulator = "CUI P7812-500R, JLC C6351743, DNP unless a 24 V heater population is explicitly approved."

[[protection]]
name = "input_fuse_ptc"
requirement = "Replaceable fuse/eFuse or rated PTC in heater input path; RUEF500K is suitable only within its hold/trip and connector limits."

[[protection]]
name = "reverse_polarity"
requirement = "Use polarized connector plus fuse for first bench build or source an ideal-diode/eFuse for full heater current; stocked 1N5822 is not the full-current reverse element."

[[protection]]
name = "tvs_bulk"
requirement = "VIN TVS footprint and bulk plus local ceramic decoupling near heater switching; VIN-side ceramics must be rated for the selected 12 V or 24 V population."

[[heater_channel]]
name = "HEATER0"
role = "main plate/coupon heater"
topology = "external heater pad to VIN_HEATER, low-side N-MOSFET, optional current shunt, TC4427 channel A"
default_state = "off during reset, firmware crash, USB-only power, missing lid/cartridge, cutoff open, invalid thermistor, or over-temp"

[[heater_channel]]
name = "HEATER1"
role = "lid/guard/spare heater"
topology = "external heater pad to VIN_HEATER, low-side N-MOSFET, optional current shunt, TC4427 channel B"
default_state = "DNI allowed on first assembly; off under same fault policy as HEATER0"

[thermistor_adc]
adc = "ADS1115 at 0x48 on I2C"
mux = "CD74HC4051 with THERM_MUX_S0/S1/S2 and THERM_MUX_EN_N"
divider = "10K 0.1% upper resistor to +3V3_ANA, 10K NTC to analog ground, ADC midpoint"
filter = "100-1K series plus 10-100 nF local filter per channel, compatible with mux settling"

[[thermistor_channel]]
index = 0
net = "THERM_CH_0"
logical_name = "THERM_BLOCK_A"

[[thermistor_channel]]
index = 1
net = "THERM_CH_1"
logical_name = "THERM_BLOCK_B"

[[thermistor_channel]]
index = 2
net = "THERM_CH_2"
logical_name = "THERM_LID_AUX"

[[thermistor_channel]]
index = 3
net = "THERM_CH_3"
logical_name = "THERM_AMBIENT"

[[thermistor_channel]]
index = 4
net = "THERM_CH_4"
logical_name = "THERM_CARTRIDGE_EDGE"

[[thermistor_channel]]
index = 5
net = "THERM_CH_5"
logical_name = "THERM_HEATSINK"

[[thermistor_channel]]
index = 6
net = "THERM_CH_6"
logical_name = "THERM_SPARE_0"

[[thermistor_channel]]
index = 7
net = "THERM_CH_7"
logical_name = "THERM_SPARE_1"

[safety]
hardware_defaults = [
  "HEATER_ARM pulled inactive",
  "HEATER0_PWM and HEATER1_PWM pulled inactive before firmware init",
  "LED_EXC_EN pulled inactive",
  "USB-only power cannot energize VIN_HEATER or VDRV",
  "thermal cutoff loop exposed separately from firmware commands",
]
