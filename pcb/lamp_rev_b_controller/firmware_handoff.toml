[package]
name = "lamp_rev_b_controller_firmware_handoff"
ticket = "T-4C206871"
revision = "rev_b_proto"
source_artifact = "A-5F5799DF"
module_variant = "ESP32-S3-WROOM-1-N16"
board_revision = "rev_b_proto"

[boot_defaults]
heater_arm = "low"
heater0_pwm = "low"
heater1_pwm = "low"
led_exc_en = "low"
therm_mux_en_n = "high"
fan_pwm = "low"
notes = "Configure boot-safe GPIO defaults before enabling peripherals. GPIO0, GPIO3, GPIO45, and GPIO46 are not application loads."

[[peripheral]]
name = "HeaterChannel::Block"
control = "HEATER0_PWM"
arm = "HEATER_ARM"
thermistors = ["THERM_BLOCK_A", "THERM_BLOCK_B"]
faults = ["over_temperature", "missing_thermistor", "open_short_thermistor", "lid_open", "cartridge_missing", "watchdog_timeout"]

[[peripheral]]
name = "HeaterChannel::LidAux"
control = "HEATER1_PWM"
arm = "HEATER_ARM"
thermistors = ["THERM_LID_AUX"]
faults = ["same_policy_as_block"]

[[peripheral]]
name = "ThermistorMux"
select_nets = ["THERM_MUX_S0", "THERM_MUX_S1", "THERM_MUX_S2"]
enable = "THERM_MUX_EN_N"
adc = "ADS1115"
channels = ["THERM_BLOCK_A", "THERM_BLOCK_B", "THERM_LID_AUX", "THERM_AMBIENT", "THERM_CARTRIDGE_EDGE", "THERM_HEATSINK", "THERM_SPARE_0", "THERM_SPARE_1"]
adc_input = "ADS1115 AIN0 on THERM_MUX_OUT"

[[peripheral]]
name = "Ads1115AnalogFrontEnd"
address = "0x48"
pga = "+/-4.096 V single-ended range"
channel_map = ["AIN0=THERM_MUX_OUT", "AIN1=SPARE_NO_CONNECT", "AIN2=LED_CURRENT_SENSE", "AIN3=AUX_ANALOG_IN"]
ain0_source = "Eight 10 kohm thermistor dividers filtered at each mux channel; 0-3.3 V and about 2.5 kohm worst-case divider Thevenin impedance plus CD74HC4051 on-resistance."
ain1_policy = "First-article spare is physically unassigned and must never be selected by firmware."
ain2_source = "INA180A1 low-impedance output; about 1.4 V at the populated 0.7 A LED drive and about 2.0 V only for the DNP 1.0 A alternate."
ain3_source = "External AUX_ANALOG_IN must remain within 0-3.3 V and use source impedance <=10 kohm; J23 pin 3 is reserved no-connect."

[[peripheral]]
name = "LedChannel::Excitation"
pwm = "LED_EXC_PWM"
enable = "LED_EXC_EN"
current_sense = "LED_CURRENT_SENSE"
sync = "LED_SYNC_OUT"
dim_gate = "SN74LVC1G08 gates LED_EXC_PWM AND LED_EXC_EN before LDD-700H PWM DIM"
current_scale = "INA180A1 gain 20 across 0.1 ohm shunt: about 1.4 V at 700 mA"
fault_input = "LED_FAULT_N is pulled up only; LDD-H has no native fault output in this population"
fault_policy = "forced off on boot, fault, lid open, cartridge missing, camera error, invalid current-sense reading, and LED heatsink over-temperature"

[[peripheral]]
name = "SpiCameraFrameSource"
spi = ["SPI_SCLK", "SPI_MOSI", "SPI_MISO", "CAM_CS_N"]
control = ["CAM_FRAME_INT", "CAM_RESET_N", "CAM_PWDN_N", "I2C_SDA", "I2C_SCL"]
external_sync = ["FRAME_TRIG_OUT", "EXPOSURE_ACTIVE_IN", "LED_SYNC_OUT"]
notes = "External USB/CSI host remains the mandatory first optical data path."

[[peripheral]]
name = "SafetyInterlockSnapshot"
inputs = ["LID_CLOSED_N", "CART_PRESENT_N", "LATCH_LOCKED_N", "AUX_IO0_THERMAL_CUTOFF_OK"]
unsafe_action = "disarm heaters, disable excitation LED, leave fan policy safe, and log transition"
notes = "Rev B first article has no heater-rail telemetry. The normally-closed J24 cutoff loop, thermistor plausibility/over-temperature checks, and AUX_IO0_THERMAL_CUTOFF_OK remain authoritative."

[[peripheral]]
name = "RunLogStorage"
minimum = "ESP32 NVS/flash ring log"
preferred_option = "SPI microSD/module on shared SPI with SD_CS_N after tri-state behavior is verified"
records = ["firmware_version", "board_revision", "interlock_transitions", "heater_setpoint_duty_temperature", "led_settings", "camera_exposure", "invalid_state_reasons", "result_state"]
