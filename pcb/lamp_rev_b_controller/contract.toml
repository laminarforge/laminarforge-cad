[package]
name = "lamp_rev_b_controller"
ticket = "T-4C206871"
revision = "Rev B prototype"
purpose = "Prototype controller carrier PCBA for the sealed-cartridge dry fluorescence reader."
source_stage = "materialized_board"
source_artifacts = [
  "A-45684C9D",
  "A-1BDCE3AC",
  "A-A17708F1",
  "A-CEDCB22B",
  "A-8633FB3D",
  "A-5F5799DF",
  "A-6804F5CC",
  "A-528A0BE2",
  "A-DDD3B7FB",
  "A-E46A0558",
  "A-68A6AF42",
  "A-D1FEBE37",
]

[board]
physical_board_count = 1
width_mm = 118.0
height_mm = 94.0
thickness_mm = 1.6
layer_count = 4
spatial_lane_count = 8
primary_mcu = "ESP32-S3-WROOM-1-N16"
manufacturer_class = "4-layer FR-4 prototype, ENIG preferred, top-side SMT first article"
prototype_scope = "controller_carrier_only"

[stackup]
copper_layers = ["F.Cu", "In1.Cu", "In2.Cu", "B.Cu"]
ground_plane_layer = "In1.Cu"
power_plane_layer = "In2.Cu"
outer_copper_oz = 1.0
inner_copper_oz = 0.5
min_clearance_mm = 0.15
min_signal_track_mm = 0.20
min_via_drill_mm = 0.30

[[zones]]
name = "usb_debug"
purpose = "USB-C device/programming, boot/reset, UART, status LEDs, and host logging headers."
x_min_mm = 0.0
x_max_mm = 42.0
y_min_mm = -6.0
y_max_mm = 28.0

[[zones]]
name = "mcu_antenna"
purpose = "ESP32-S3-WROOM body with antenna at a clean board edge and no-copper keepout forward of antenna."
x_min_mm = 43.0
x_max_mm = 80.0
y_min_mm = -6.0
y_max_mm = 36.0

[[zones]]
name = "low_voltage_power"
purpose = "VIN protection handoff, 5 V buck/module option, 3.3 V logic, analog filtering, rail jumpers."
x_min_mm = 80.0
x_max_mm = 118.0
y_min_mm = -6.0
y_max_mm = 32.0

[[zones]]
name = "heater_power"
purpose = "External 12/24 V entry, protected heater rail, TC4427 gate driver, MOSFETs, heater terminals, current sense."
x_min_mm = 82.0
x_max_mm = 118.0
y_min_mm = 32.0
y_max_mm = 88.0

[[zones]]
name = "thermistor_analog"
purpose = "ADS1115, CD74HC4051, 10K divider network, analog expansion, and quiet thermistor harnesses."
x_min_mm = 0.0
x_max_mm = 48.0
y_min_mm = 30.0
y_max_mm = 88.0

[[zones]]
name = "optical_interface"
purpose = "470-490 nm LED driver/control, external camera sync, SPI/FIFO camera module option, lid/cartridge interlocks."
x_min_mm = 48.0
x_max_mm = 82.0
y_min_mm = 36.0
y_max_mm = 88.0

[[modules]]
name = "esp32_s3"
status = "required"
owner = "schematic"
deliverable = "ESP32-S3-WROOM-1-N16 module footprint, EN, GPIO0 boot, native USB, UART, I2C, SPI, safe GPIO defaults, antenna keepout."

[[modules]]
name = "usb_programming_power"
status = "required"
owner = "schematic"
deliverable = "USB-C UFP/device path with CC pull-downs, ESD, D+/D-, VBUS sense, and USB-only logic bring-up."

[[modules]]
name = "power_entry"
status = "required"
owner = "schematic"
deliverable = "External 12 V default input connector, PTC/fuse footprint, TVS footprint, protected VIN, P7805-2000-S 5 V module, AP63203WU-7 3.3 V buck, FB1 filtered +3V3_ANA branch, and R55 12 V-only VDRV feed explicitly DNP unless regulated for 24 V."

[[modules]]
name = "heater_drive"
status = "required"
owner = "schematic"
deliverable = "Two low-side heater channels using TC4427-class drive, MOSFET footprints, heater terminals, current-sense footprints, hardware heater arm, and J24 high-current external cutoff loop between VIN_PROTECTED and VIN_HEATER."

[[modules]]
name = "temperature_sense"
status = "required"
owner = "schematic"
deliverable = "ADS1115 + CD74HC4051 thermal front end with eight 10K NTC channels, RC filter footprints, and analog test pads."

[[modules]]
name = "optics_control"
status = "required"
owner = "schematic"
deliverable = "Mean Well LDD-700H constant-current LED driver module, SN74LVC1G08 DIM gating, INA180 current telemetry, LED output connector, LED thermal sense, external camera sync, optional SPI/FIFO camera connector."

[[modules]]
name = "interlocks"
status = "required"
owner = "schematic"
deliverable = "Lid, cartridge, latch, thermal cutoff/kill status, fan, and hardware-off safety defaults."

[[modules]]
name = "firmware_debug_logging"
status = "required"
owner = "firmware"
deliverable = "Stable firmware handoff for pins, logical peripherals, NVS/minimum logging, optional SPI storage, and host sync/logging."

[[modules]]
name = "manufacturing_test"
status = "required"
owner = "layout"
deliverable = "Accessible labeled pads for rails, USB, ESP32 boot/debug, heater, thermistor, LED, camera/sync, interlocks, and spare GPIO."

[[rails]]
name = "VBUS"
nominal_voltage_v = 5.0
max_current_ma = 500
source = "usb_c_device_port"
must_have_testpoint = true

[[rails]]
name = "VIN_12_24"
nominal_voltage_v = 12.0
max_current_ma = 5000
source = "external_current_limited_dc_supply"
must_have_testpoint = true

[[rails]]
name = "VIN_PROTECTED"
nominal_voltage_v = 12.0
max_current_ma = 5000
source = "post_fuse_tvs_polarized_input"
must_have_testpoint = true

[[rails]]
name = "VIN_HEATER"
nominal_voltage_v = 12.0
max_current_ma = 5000
source = "VIN_PROTECTED through J24 high-current external normally-closed cutoff or rated jumper loop; do not short VIN_PROTECTED to VIN_HEATER in copper"
must_have_testpoint = true

[[rails]]
name = "VDRV"
nominal_voltage_v = 12.0
max_current_ma = 100
source = "R55 0R feed link from VIN_PROTECTED for 12 V first article only; direct VIN path is DNP for 24 V unless optional P7812-500R or approved 12 V regulator is populated"
must_have_testpoint = true

[[rails]]
name = "+5V"
nominal_voltage_v = 5.0
max_current_ma = 2000
source = "P7805-2000-S from VIN_PROTECTED"
must_have_testpoint = true

[[rails]]
name = "+3V3"
nominal_voltage_v = 3.3
max_current_ma = 800
source = "AP63203WU-7 fixed buck from +5V"
must_have_testpoint = true

[[rails]]
name = "+3V3_ANA"
nominal_voltage_v = 3.3
max_current_ma = 100
source = "FB1 filtered branch from +3V3; FB1 pin 1 is +3V3 and pin 2 is +3V3_ANA"
must_have_testpoint = true

