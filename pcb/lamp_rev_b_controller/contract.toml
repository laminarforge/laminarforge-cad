[verification]
required_gates = [
  "lamp_rev_b_controller_check",
  "lamp_rev_b_controller_materialize_schematic",
  "lamp_rev_b_controller_erc_report",
  "lamp_rev_b_controller_materialize_board",
  "lamp_rev_b_controller_seed_routes_from_drc",
  "lamp_rev_b_controller_route_report",
  "lamp_rev_b_controller_fab_preview",
  "kicad-cli pcb drc before any fab release claim",
]
autorouter_policy = "Use manual or KiCad-reviewed routing first. Freerouting is diagnostic only after zero physical pre-route DRC."
simulation_policy = "Prototype source package only; heater and optical validation stay in bring-up documentation, not external validation plan."

[manufacturing]
target_vendor = "JLCPCB/PCBWay/Seeed/MacroFab prototype quote"
assembly_side = "top"
first_article_quantity = 5
bare_board_overbuild_quantity = "5-10 if cheap"
requires_bom_lcsc = true
requires_cpl = true
requires_gerbers = true
requires_drills = true
requires_drc_clean = true
license_marking = "CERN-OHL-S v2"
no_substitution_policy = "No substitutions for ESP32 module, regulator, ADC, mux, LED driver path, MOSFET/gate driver, USB-C connector, camera connector, heater connectors, or safety parts without approval."
