kibot:
  version: 1

preflight:
  run_erc: true
  run_drc: true

outputs:
  - name: gerbers
    type: gerber
    dir: fab/gerbers
    layers: [F.Cu, In1.Cu, In2.Cu, B.Cu, F.Mask, B.Mask, F.Paste, B.Paste, F.SilkS, B.SilkS, Edge.Cuts]
  - name: drills
    type: excellon
    dir: fab/drills
  - name: position
    type: position
    dir: fab/assembly
    options:
      output: lamp_rev_b_controller_position.csv
      format: CSV
      units: millimeters
