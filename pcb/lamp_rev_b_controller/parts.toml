[package]
name = "lamp_rev_b_controller_parts"
ticket = "T-4C206871"
revision = "Rev B prototype"
source_stage = "materialized_board"

[schematic]
root_file = "lamp_rev_b_controller.kicad_sch"
symbol_library = "../lib/lcsc.kicad_sym"
footprint_library = "../lib/lcsc.pretty"

[[blocks]]
name = "mcu_usb_debug"
title = "MCU / USB / Programming"
modules = ["esp32_s3", "usb_programming_power", "firmware_debug_logging"]
required_nets = ["+3V3", "GND", "USB_DP", "USB_DN", "USB_CC1", "USB_CC2", "VBUS", "USB_VBUS_SENSE", "ESP_EN", "ESP_GPIO0_BOOT", "UART0_TXD", "UART0_RXD", "I2C_SDA", "I2C_SCL"]

[[blocks]]
name = "power_entry"
title = "External Power / Rails"
modules = ["power_entry"]
required_nets = ["VIN_12_24", "VIN_PROTECTED", "VIN_HEATER", "VDRV", "+5V", "+3V3", "+3V3_ANA", "3V3_SW", "3V3_BST", "GND"]

[[blocks]]
name = "heater_drive"
title = "Heater Drive"
modules = ["heater_drive", "interlocks"]
required_nets = ["VIN_HEATER", "VDRV", "HEATER_ARM", "HEATER0_PWM", "HEATER1_PWM", "HEATER0_GATE", "HEATER1_GATE", "HEATER0_LOW", "HEATER1_LOW", "AUX_IO0_THERMAL_CUTOFF_OK", "GND"]

[[blocks]]
name = "temperature_sense"
title = "Thermistor / ADC / Mux"
modules = ["temperature_sense"]
required_nets = ["+3V3_ANA", "+3V3", "I2C_SDA", "I2C_SCL", "THERM_MUX_S0", "THERM_MUX_S1", "THERM_MUX_S2", "THERM_MUX_EN_N", "THERM_MUX_OUT", "LED_CURRENT_SENSE", "AUX_ANALOG_IN", "THERM_CH_0", "THERM_CH_1", "THERM_CH_2", "THERM_CH_3", "THERM_CH_4", "THERM_CH_5", "THERM_CH_6", "THERM_CH_7", "GND"]

[[blocks]]
name = "optics_camera"
title = "Optics / Camera / Sync"
modules = ["optics_control"]
required_nets = ["LED_EXC_PWM", "LED_EXC_EN", "LED_DIM_GATE", "LED_DIM_DRIVE", "LED_FAULT_N", "LED_CURRENT_SENSE", "LED_SUPPLY", "LED_DRV_PLUS", "LED_PLUS", "LED_MINUS", "LED_SYNC_OUT", "FRAME_TRIG_OUT", "EXPOSURE_ACTIVE_IN", "SPI_SCLK", "SPI_MOSI", "SPI_MISO", "CAM_CS_N", "CAM_FRAME_INT", "CAM_RESET_N", "CAM_PWDN_N", "I2C_SDA", "I2C_SCL", "+3V3", "GND"]

[[blocks]]
name = "interlocks_and_expansion"
