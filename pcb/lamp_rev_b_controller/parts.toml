[[selection_gaps]]
id = "integrated_buck_regulator"
module = "power_entry"
blocks_fabrication = true
reason = "First source package uses a buck-module/header footprint so bring-up can proceed without hardcoding a regulator layout before VIN and load are verified."
resolve_with = "Select exact >=36 V input buck regulator/module population, layout requirements, BOM source, and thermal margin before fab release."

[[selection_gaps]]
id = "constant_current_led_driver_ic"
module = "optics_control"
blocks_fabrication = true
reason = "Rev B optics lane requires controlled constant current, but LED module/current/heatsink are not frozen."
resolve_with = "Choose exact 470-490 nm LED driver or driver module, current set range, dimming method, and connector before order release."

[[selection_gaps]]
id = "camera_module_connector_family"
module = "optics_control"
blocks_fabrication = false
reason = "Mandatory first optical path is an external USB/CSI camera host; embedded SPI/FIFO camera connector is optional/debug."
resolve_with = "Select camera module and connector/cable family after optical carrier breadboard data."
