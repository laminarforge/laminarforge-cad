modules = ["interlocks", "manufacturing_test"]
required_nets = ["LID_CLOSED_N", "CART_PRESENT_N", "LATCH_LOCKED_N", "AUX_IO0_THERMAL_CUTOFF_OK", "FAN_PWM", "FAN_TACH", "STATUS_RUN_LED", "STATUS_FAULT_LED", "SPARE_GPIO42", "AUX_ANALOG_IN", "GND", "+3V3"]

