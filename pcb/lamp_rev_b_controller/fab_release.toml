[package]
name = "lamp_rev_b_controller_fab_preview"
ticket = "T-C7BBBEA3"
revision = "Rev B prototype"
source_stage = "routed_preview_pending_electrical_resolution"
release_state = "blocked_on_reviewed_electrical_issues"

[toolchain]
min_kicad_major = 10

[inputs]
board = "pcb/lamp_rev_b_controller/lamp_rev_b_controller.kicad_pcb"
schematic = "pcb/lamp_rev_b_controller/lamp_rev_b_controller.kicad_sch"
contract = "pcb/lamp_rev_b_controller/contract.toml"
parts = "pcb/lamp_rev_b_controller/parts.toml"
placement = "pcb/lamp_rev_b_controller/placement.toml"
pin_nets = "pcb/lamp_rev_b_controller/pin_nets.toml"
firmware_handoff = "pcb/lamp_rev_b_controller/firmware_handoff.toml"
electrical_validation = "pcb/lamp_rev_b_controller/electrical_validation.toml"
routing_seed = "pcb/lamp_rev_b_controller/routing_seed.toml"

[outputs]
preview_dir = "pcb/lamp_rev_b_controller/fab"
reports_dir = "pcb/lamp_rev_b_controller/reports"
bom_file = "bom.csv"
cpl_file = "cpl.csv"
route_report = "drc.json"
erc_report = "erc.json"

[erc_review]
[[erc_review.accepted_findings]]
violation_type = "lib_symbol_issues"
severity = "warning"
description = "The current configuration does not include the symbol library ''"
item_description_contains = "[LF_CAPTURE_"
reason = "Generated per-reference LF_CAPTURE symbols are embedded in the schematic; no external empty-name library is required."

[[erc_review.accepted_findings]]
violation_type = "isolated_pin_label"
severity = "warning"
description = "Label connected to only one pin"
item_description_exact = "Global Label 'LED_FAULT_N'"
reason = "The selected LDD-700H has no native fault output; R54 intentionally reserves a pulled-up, currently undriven future-fault node."

[assembly]
machine_side = "top"
manual_part_ids = [
  "dc_input_terminal",
  "five_v_buck_module",
  "thermistor_headers",
  "heater_mosfets",
  "heater_output_terminals",
  "heater_cutoff_loop_terminal",
  "led_driver_module",
  "led_output_terminal",
  "led_sense_header",
  "opt_sync_header",
  "camera_spi_header",
  "interlock_header",
  "fan_header",
  "uart_prog_header",
  "i2c_exp_header",
  "analog_opt_header",
]
dnp_part_ids = [
  "heater_current_shunts",
]
no_substitution_part_ids = [
  "five_v_buck_module",
  "three_v_three_regulator",
  "three_v_three_inductor",
  "analog_3v3_filter_link",
  "vdrv_12v_feed_link",
  "heater_cutoff_loop_terminal",
  "led_driver_module",
  "led_dim_and_gate",
  "led_current_sense_amp",
  "led_current_shunt",
]
dnp_alternates = [
  "Mean Well LDD-1000H C17529736 is a thermal-validation alternate only and is DNP for the first release population.",
  "CUI P7812-500R C6351743 24 V VDRV regulator path is DNP unless a 24 V heater population is explicitly approved.",
  "R55 direct VIN_PROTECTED-to-VDRV feed is populated only for the 12 V first article and is DNP for any 24 V build unless an approved 12 V regulator path is populated.",
]

[release_blockers]
items = [
  "U1 exposed-pad net GND_EP is isolated from system GND; resolve the pad-41 grounding intent and revalidate the resulting board without bypassing DRC.",
  "HEATER_SUPPLY_SENSE terminates only at TP_HEATER_SENSE and has no populated source or ADC endpoint; human review must either remove this unsupported interface or approve a concrete sensing circuit and ADC mapping.",
]
