three_v_three_rail = "+3V3"
cc_rd_ohm = 5100.0
min_cc_rd_ohm = 4080.0
max_cc_rd_ohm = 6120.0
default_current_ma = 500
max_steady_utilization = 1.0
max_vbus_bulk_cap_u = 10.0
required_first_article_measurements = ["usb_vbus_voltage", "usb_5v_voltage", "usb_3v3_voltage"]
notes = "Rev A is a USB-C sink with Rd only and no PD negotiation; design to USB 2.0/default current until first article confirms host behavior."

