verification_method = "Inspect Q1 orientation and verify heater return stays off until HEATER_PWM is commanded."
notes = "MOSFET source/drain/gate pinout errors can make the heater stuck on or un-switchable."
[connector_polarity_checks.required_pins]
"1" = "GATE_DRV"
"2" = "GND"
"3" = "HEATER_P"

