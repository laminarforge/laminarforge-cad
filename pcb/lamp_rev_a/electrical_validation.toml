[single_fault_policy]
max_rpn = 120
require_detection_for_severity_at_least = 7
require_hardware_mitigation_for_severity_at_least = 7
require_first_article_for_severity_at_least = 7

[emc_esd_policy]
min_checks = 5
max_risk_score = 100
require_protection_for_risk_at_least = 50
require_measurement_for_risk_at_least = 50
require_external_analysis_for_risk_at_least = 70
require_return_path_strategy = true

[boot_startup_policy]
min_checks = 6
require_all_boot_sensitive_firmware_pins = true
require_evidence_for_boot_sensitive = true
require_measurement_for_safety_critical = true
forbid_active_safety_outputs_at_reset = true

[manufacturing_test_policy]
min_checks = 8
require_test_points = true
require_pass_criterion = true
require_measurement_or_firmware_test = true

[calibration_policy]
min_checks = 6
require_control_conditions = true
require_acceptance_criterion = true
require_firmware_dependency = true
require_output_artifacts = true

[[calibration_checks]]
id = "heater_ramp_calibration"
subsystem = "heater_control"
calibrated_item = "Heater power ramp and fail-closed cutoff behavior"
dependent_nets = ["HEATER_SUPPLY", "HEATER_P", "HEATER_PWM", "GATE_DRV", "GND"]
preconditions = ["External inline thermal cutoff installed", "Bench supply current limit <= 3000 mA", "Firmware build identity recorded"]
procedure = "Run low-duty heater PWM into the real heater or dummy load, log rail voltage, return voltage, PWM state, current, MOSFET case temperature, and heater temperature."
acceptance_criterion = "Temperature ramp is monotonic and controllable; heater output returns off when heater_enabled is false; MOSFET/diode/terminal temperatures remain inside derating budget."
control_data = ["ambient temperature", "heater load resistance", "current limit", "firmware commit"]
required_outputs = ["heater_ramp_log.csv", "heater_thermal_photo_or_case_temp_log", "tested_firmware_identity"]
verification_measurements = ["heater_supply_voltage_pwm_off", "heater_return_pwm_off", "heater_pwm_idle"]
firmware_dependency = "Rev A firmware heater_enabled interlock and status API."
notes = "This is the calibration bridge between electrical safety gates and actual LAMP incubation control."

[[calibration_checks]]
id = "adc_dark_baseline"
subsystem = "optical_detection"
calibrated_item = "ADC/TIA dark baseline"
dependent_nets = ["ADC_AIN1", "MUX_COM", "+3V3", "GND"]
preconditions = ["USB-only electronics rail validated", "LED emitters disabled", "Optical path covered or dark"]
procedure = "Record ADC_AIN1 dark readings with all emitters disabled and mux states stable."
acceptance_criterion = "Dark baseline stays inside the ADC 3.3 V domain, does not saturate, and has repeatable noise low enough for later on/off slope testing."
control_data = ["dark optical state", "sample count", "firmware commit", "ADC gain/data rate"]
required_outputs = ["adc_dark_baseline.csv", "adc_noise_summary.md"]
verification_measurements = ["analog_adc_idle", "usb_3v3_voltage"]
firmware_dependency = "Firmware ADC sampling path and out-of-range rejection."
notes = "A quiet dark baseline is required before interpreting optical LAMP signal slope."

[[calibration_checks]]
id = "eight_slot_optical_response"
subsystem = "optical_detection"
calibrated_item = "Eight-slot LED/photodiode response"
dependent_nets = ["LED_BASE_0", "LED_BASE_1", "LED_BASE_2", "LED_BASE_3", "LED_BASE_4", "LED_BASE_5", "LED_BASE_6", "LED_BASE_7", "MUX_COM", "ADC_AIN1", "+3V3", "GND"]
preconditions = ["ADC dark baseline recorded", "Emitter current limited", "Known optical fixture/tube state"]
procedure = "Cycle one LED channel at a time, capture dark/on ADC readings per slot, and confirm channel mapping matches the firmware handoff."
acceptance_criterion = "All eight slots show detectable on/off delta without ADC saturation and without adjacent-channel gross crosstalk."
control_data = ["slot map", "LED drive setting", "tube/fixture condition", "firmware commit"]
required_outputs = ["optical_slot_response.csv", "slot_mapping_check.md"]
verification_measurements = ["analog_adc_idle"]
firmware_dependency = "Firmware optical diagnostic that cycles all eight LED channels."
notes = "This validates that the board can produce usable optical data before any wet assay claims."

[[calibration_checks]]
id = "i2c_adc_device_identity"
subsystem = "sensor_bus"
calibrated_item = "ADS1115 bus identity and I2C idle behavior"
dependent_nets = ["SDA", "SCL", "+3V3", "GND"]
preconditions = ["USB-only +3V3 validated", "SDA/SCL idle-high measured", "No heater PWM activity"]
procedure = "Run firmware I2C scan and capture ADS1115 address, bus idle state, and timeout/fail-closed behavior."
acceptance_criterion = "ADS1115 responds at the expected address and firmware refuses assay start if I2C is stuck low or the ADC is absent."
control_data = ["expected address", "I2C pull-up value", "firmware commit"]
required_outputs = ["i2c_scan_log.txt", "sensor_fault_behavior.md"]
verification_measurements = ["i2c_sda_idle", "i2c_scl_idle", "usb_3v3_voltage"]
firmware_dependency = "Firmware I2C scan, timeout handling, and status reporting."
notes = "This keeps a sensor-bus failure from becoming a false diagnostic result."

[[calibration_checks]]
id = "negative_control_assay_baseline"
subsystem = "assay_readout"
calibrated_item = "Negative-control optical/thermal baseline"
dependent_nets = ["ADC_AIN1", "MUX_COM", "HEATER_PWM", "HEATER_SUPPLY", "HEATER_P", "+3V3", "GND"]
preconditions = ["Heater ramp calibration complete", "Eight-slot optical response complete", "No-template control sample available"]
procedure = "Run a dry or no-template-control profile and log temperature proxy, heater duty, and optical signal over the intended assay window."
acceptance_criterion = "Negative-control signal remains stable enough to define threshold margins and does not show heater-induced false-positive drift."
control_data = ["control sample identity", "ambient temperature", "firmware commit", "assay duration"]
required_outputs = ["negative_control_run.csv", "threshold_margin_notes.md"]
verification_measurements = ["analog_adc_idle", "heater_pwm_idle"]
firmware_dependency = "Firmware test-run logging and threshold computation path."
notes = "This is still not final wet validation; it is the board-level baseline before real HSV-2 chemistry claims."

[[calibration_checks]]
id = "firmware_identity_traceability"
subsystem = "release_traceability"
calibrated_item = "Firmware/build identity tied to board calibration records"
dependent_nets = ["VBUS", "+3V3", "UART_TX", "UART_RX", "USB_DP", "USB_DN"]
preconditions = ["Firmware CI artifact flashed", "USB or UART diagnostics available", "Fab release checksum manifest saved"]
procedure = "Record firmware version/commit from the status API or UART diagnostic output alongside fab release checksum and board serial/lot."
acceptance_criterion = "Every calibration output references the exact firmware commit and fab release bundle checksum used for the test."
control_data = ["firmware commit", "fab bundle checksum", "board serial or build label"]
required_outputs = ["calibration_traceability_record.md", "firmware_identity_capture.txt"]
verification_measurements = ["usb_3v3_voltage"]
firmware_dependency = "Firmware status API exposes version and source commit."
notes = "This prevents a passing calibration from becoming unusable because the tested hardware/firmware version is ambiguous."

[[manufacturing_test_checks]]
id = "power_off_rail_short_screen"
subsystem = "power"
nets = ["VBUS", "+3V3", "+12V_RAW", "GND"]
required_test_points = ["TP_VBUS", "TP_3V3", "TP_12V", "TP_GND"]
test_stage = "bare-board or assembled power-off inspection"
test_method = "DMM resistance checks from each rail test point to TP_GND before applying USB or 12 V."
firmware_test = ""
pass_criterion = "No low-ohm rail-to-ground short before any powered bring-up."
verification_measurements = ["power_off_vbus_resistance", "power_off_3v3_resistance"]
notes = "This is the fastest way to catch assembly shorts before current is available."

[[manufacturing_test_checks]]
id = "usb_power_and_programming_screen"
subsystem = "usb_mcu"
nets = ["VBUS", "+5V", "+3V3", "ESP_EN", "ESP_GPIO0", "USB_DP", "USB_DN"]
required_test_points = ["TP_VBUS", "TP_5V", "TP_3V3", "TP_EN", "TP_BOOT"]
test_stage = "USB-only bring-up"
test_method = "Current-limited USB power, rail measurement, boot strap measurement, USB enumeration, and firmware flash attempt."
firmware_test = "Flash the Rev A CI artifact or run firmware USB enumeration check."
pass_criterion = "Board enumerates/accepts firmware while VBUS, +5V, +3V3, EN, and BOOT stay in expected ranges."
verification_measurements = ["usb_vbus_voltage", "usb_5v_voltage", "usb_3v3_voltage", "esp_en_idle", "esp_gpio0_boot_idle"]
notes = "Covers the recovery path before heater power is attached."

[[manufacturing_test_checks]]
id = "uart_debug_access_screen"
subsystem = "debug"
nets = ["UART_TX", "UART_RX", "GND"]
required_test_points = ["TP_TX", "TP_RX", "TP_GND"]
test_stage = "firmware debug access"
test_method = "Probe UART TX/RX pads or attach a 3.3 V UART adapter during firmware diagnostic mode."
firmware_test = "Firmware diagnostic build prints boot identity and accepts a non-destructive status command."
pass_criterion = "UART pads are physically accessible and remain in the 3.3 V logic domain."
verification_measurements = []
notes = "UART is the fallback debug path if native USB is unreliable."

[[manufacturing_test_checks]]
id = "heater_fail_closed_screen"
subsystem = "heater_drive"
nets = ["HEATER_SUPPLY", "HEATER_P", "HEATER_PWM", "GATE_DRV", "GND"]
required_test_points = ["TP_HEATER_SUPPLY", "TP_HEATER", "TP_PWM", "TP_GND"]
test_stage = "heater power present, PWM disabled"
test_method = "Attach current-limited 12 V with external cutoff installed, then verify supply/return/PWM before any heater command."
firmware_test = "Firmware heater_enabled interlock remains false until explicit validated command."
pass_criterion = "HEATER_SUPPLY is present, HEATER_P and HEATER_PWM remain off, and no load current flows before command."
verification_measurements = ["heater_supply_voltage_pwm_off", "heater_return_pwm_off", "heater_pwm_idle"]
notes = "Covers the highest-energy board output in a production-test-friendly form."

[[manufacturing_test_checks]]
id = "i2c_adc_bus_screen"
subsystem = "optical_detection"
nets = ["SDA", "SCL", "ADC_AIN1", "MUX_COM", "+3V3", "GND"]
required_test_points = ["TP_SDA", "TP_SCL", "TP_ADC", "TP_MUX", "TP_3V3", "TP_GND"]
test_stage = "firmware idle sensor bring-up"
test_method = "Confirm I2C idle levels, ADS1115 presence, ADC idle range, and mux common accessibility."
firmware_test = "Firmware I2C scan detects ADS1115 and refuses assay start if the bus is stuck low."
pass_criterion = "I2C idles high, ADS1115 is reachable, and ADC/TIA path stays in the 3.3 V domain."
verification_measurements = ["i2c_sda_idle", "i2c_scl_idle", "analog_adc_idle"]
notes = "Catches functional false-result risk before wet assay testing."

[[manufacturing_test_checks]]
id = "optical_channel_smoke_screen"
subsystem = "optical_detection"
nets = ["LED_BASE_0", "LED_BASE_1", "LED_BASE_2", "LED_BASE_3", "LED_BASE_4", "LED_BASE_5", "LED_BASE_6", "LED_BASE_7", "MUX_COM", "ADC_AIN1", "GND"]
required_test_points = ["TP_ADC", "TP_MUX", "TP_GND"]
test_stage = "dry optical calibration"
test_method = "Run one-channel-at-a-time LED smoke test and confirm ADC slope stays inside the non-saturating range."
firmware_test = "Firmware optical diagnostic cycles all eight LED channels and reports dark/on ADC values."
pass_criterion = "Every channel has a detectable on/off delta without saturating ADC_AIN1."
verification_measurements = ["analog_adc_idle"]
notes = "This is not assay validation; it confirms the board can exercise the optical path."

[[manufacturing_test_checks]]
id = "manual_parts_install_screen"
subsystem = "assembly"
nets = ["+12V_RAW", "HEATER_SUPPLY", "HEATER_P", "GND"]
required_test_points = ["TP_12V", "TP_HEATER_SUPPLY", "TP_HEATER", "TP_GND"]
test_stage = "post-manual-install inspection"
test_method = "Inspect and tug-test DC jack, heater terminal, wire polarity, and external inline thermal cutoff installation."
firmware_test = ""
pass_criterion = "Manual through-hole parts are installed, polarized wiring is correct, and heater cutoff is present before 12 V power."
verification_measurements = ["heater_raw_12v_voltage", "heater_supply_voltage_pwm_off"]
notes = "The JLC machine-assembly package intentionally excludes these manual install parts."

[[manufacturing_test_checks]]
id = "release_artifact_traceability_screen"
subsystem = "release"
nets = ["VBUS", "+3V3", "HEATER_SUPPLY", "HEATER_P", "ADC_AIN1", "SDA", "SCL"]
required_test_points = ["TP_VBUS", "TP_3V3", "TP_HEATER_SUPPLY", "TP_HEATER", "TP_ADC", "TP_SDA", "TP_SCL"]
test_stage = "release artifact review"
test_method = "Confirm fab bundle includes firmware handoff, electrical gate report, first-article measurements, FMEA, EMC/ESD, startup safety, and checksum manifest."
firmware_test = "Firmware CI artifact exposes build identity that matches the flashed test record."
pass_criterion = "The board under test can be traced back to the exact release bundle and firmware build used for validation."
verification_measurements = ["usb_3v3_voltage", "heater_supply_voltage_pwm_off", "analog_adc_idle"]
notes = "This prevents bring-up data from becoming disconnected from the generated board and firmware sources."

[[boot_startup_checks]]
id = "esp_en_reset_release"
net = "ESP_EN"
module_pin = 3
function = "ESP32-S3 chip enable/reset"
expected_power_on_state = "Held in the valid 3.3 V logic domain after USB power is stable and reset is released."
safe_state = "Reset test point is accessible; board can be held in reset during bring-up."
boot_sensitive = true
safety_critical = false
allowed_active_at_reset = true
evidence_ids = ["resistor_10k", "gpio_domain", "firmware_handoff"]
verification_methods = ["Measure TP_EN during USB-only bring-up.", "Confirm reset control does not couple into the heater domain."]
verification_measurements = ["esp_en_idle"]
notes = "A missing or wrong EN pull state can make the ESP32-S3 appear dead even when rails are correct."

[[boot_startup_checks]]
id = "esp_gpio0_normal_boot"
net = "ESP_GPIO0"
module_pin = 27
function = "ESP32-S3 boot strap"
expected_power_on_state = "Pulled high for normal boot; intentionally pulled low only during bootloader entry."
safe_state = "Normal boot strap state is visible at TP_BOOT before flashing."
boot_sensitive = true
safety_critical = false
allowed_active_at_reset = false
evidence_ids = ["resistor_10k", "gpio_domain", "firmware_handoff"]
verification_methods = ["Measure TP_BOOT during USB-only bring-up.", "Confirm bootloader entry still works without forcing other strap pins."]
verification_measurements = ["esp_gpio0_boot_idle"]
notes = "GPIO0 is the recovery path for firmware flashing and must not be accidentally held low or hard-driven."

[[boot_startup_checks]]
id = "sda_gpio46_strap_idle"
net = "SDA"
module_pin = 16
function = "I2C SDA on ESP32-S3 boot-sensitive GPIO46"
expected_power_on_state = "Pulled high through the I2C pull-up and not driven low by attached devices during reset."
safe_state = "I2C bus idles high before firmware probes the ADS1115."
boot_sensitive = true
safety_critical = false
allowed_active_at_reset = false
evidence_ids = ["resistor_4k7", "gpio_domain", "firmware_handoff"]
verification_methods = ["Measure TP_SDA idle-high before starting a test.", "Confirm ADS1115 bring-up fails closed if the bus is stuck low."]
verification_measurements = ["i2c_sda_idle"]
notes = "GPIO46 is boot-sensitive on ESP32-S3, so the I2C bus must not hold it in an invalid reset state."

[[boot_startup_checks]]
id = "led_base4_gpio48_strap_load"
net = "LED_BASE_4"
module_pin = 25
function = "Optical slot 4 LED drive on ESP32-S3 boot-sensitive GPIO48"
expected_power_on_state = "High impedance during reset; external LED base network must not force an invalid strap state."
safe_state = "Emitter remains off until firmware deliberately enables the optical channel."
boot_sensitive = true
safety_critical = false
allowed_active_at_reset = false
evidence_ids = ["led_low_side_drivers", "resistor_1k", "firmware_handoff"]
verification_methods = ["Inspect the LED base resistor/transistor orientation.", "During optical calibration, confirm slot 4 emitter is off before firmware command."]
verification_measurements = []
notes = "This explicitly tracks the ESP32-S3 boot-sensitive LED drive assignment even though Rev A has no dedicated test point on this net."

[[boot_startup_checks]]
id = "led_base5_gpio45_strap_load"
net = "LED_BASE_5"
module_pin = 26
function = "Optical slot 5 LED drive on ESP32-S3 boot-sensitive GPIO45"
expected_power_on_state = "High impedance during reset; external LED base network must not force an invalid strap state."
safe_state = "Emitter remains off until firmware deliberately enables the optical channel."
boot_sensitive = true
safety_critical = false
