require_protection_for_risk_at_least = 50
require_measurement_for_risk_at_least = 50
require_external_analysis_for_risk_at_least = 70
require_return_path_strategy = true

[boot_startup_policy]
min_checks = 6
require_all_boot_sensitive_firmware_pins = true
require_evidence_for_boot_sensitive = true
require_measurement_for_safety_critical = true
forbid_active_safety_outputs_at_reset = true

[manufacturing_test_policy]
min_checks = 8
require_test_points = true
require_pass_criterion = true
require_measurement_or_firmware_test = true

[calibration_policy]
min_checks = 6
require_control_conditions = true
require_acceptance_criterion = true
require_firmware_dependency = true
require_output_artifacts = true

[[calibration_checks]]
id = "heater_ramp_calibration"
subsystem = "heater_control"
calibrated_item = "Heater power ramp and fail-closed cutoff behavior"
dependent_nets = ["HEATER_SUPPLY", "HEATER_P", "HEATER_PWM", "GATE_DRV", "GND"]
preconditions = ["External inline thermal cutoff installed", "Bench supply current limit <= 3000 mA", "Firmware build identity recorded"]
procedure = "Run low-duty heater PWM into the real heater or dummy load, log rail voltage, return voltage, PWM state, current, MOSFET case temperature, and heater temperature."
acceptance_criterion = "Temperature ramp is monotonic and controllable; heater output returns off when heater_enabled is false; MOSFET/diode/terminal temperatures remain inside derating budget."
control_data = ["ambient temperature", "heater load resistance", "current limit", "firmware commit"]
required_outputs = ["heater_ramp_log.csv", "heater_thermal_photo_or_case_temp_log", "tested_firmware_identity"]
verification_measurements = ["heater_supply_voltage_pwm_off", "heater_return_pwm_off", "heater_pwm_idle"]
firmware_dependency = "Rev A firmware heater_enabled interlock and status API."
notes = "This is the calibration bridge between electrical safety gates and actual LAMP incubation control."

[[calibration_checks]]
id = "adc_dark_baseline"
subsystem = "optical_detection"
calibrated_item = "ADC/TIA dark baseline"
dependent_nets = ["ADC_AIN1", "MUX_COM", "+3V3", "GND"]
preconditions = ["USB-only electronics rail validated", "LED emitters disabled", "Optical path covered or dark"]
procedure = "Record ADC_AIN1 dark readings with all emitters disabled and mux states stable."
acceptance_criterion = "Dark baseline stays inside the ADC 3.3 V domain, does not saturate, and has repeatable noise low enough for later on/off slope testing."
control_data = ["dark optical state", "sample count", "firmware commit", "ADC gain/data rate"]
required_outputs = ["adc_dark_baseline.csv", "adc_noise_summary.md"]
verification_measurements = ["analog_adc_idle", "usb_3v3_voltage"]
firmware_dependency = "Firmware ADC sampling path and out-of-range rejection."
notes = "A quiet dark baseline is required before interpreting optical LAMP signal slope."

[[calibration_checks]]
id = "eight_slot_optical_response"
subsystem = "optical_detection"
calibrated_item = "Eight-slot LED/photodiode response"
dependent_nets = ["LED_BASE_0", "LED_BASE_1", "LED_BASE_2", "LED_BASE_3", "LED_BASE_4", "LED_BASE_5", "LED_BASE_6", "LED_BASE_7", "MUX_COM", "ADC_AIN1", "+3V3", "GND"]
preconditions = ["ADC dark baseline recorded", "Emitter current limited", "Known optical fixture/tube state"]
procedure = "Cycle one LED channel at a time, capture dark/on ADC readings per slot, and confirm channel mapping matches the firmware handoff."
acceptance_criterion = "All eight slots show detectable on/off delta without ADC saturation and without adjacent-channel gross crosstalk."
control_data = ["slot map", "LED drive setting", "tube/fixture condition", "firmware commit"]
required_outputs = ["optical_slot_response.csv", "slot_mapping_check.md"]
verification_measurements = ["analog_adc_idle"]
firmware_dependency = "Firmware optical diagnostic that cycles all eight LED channels."
notes = "This validates that the board can produce usable optical data before any wet assay claims."

[[calibration_checks]]
id = "i2c_adc_device_identity"
subsystem = "sensor_bus"
calibrated_item = "ADS1115 bus identity and I2C idle behavior"
