[package]
name = "lamp_rev_a_electrical_validation"
ticket = "T-55545112"
revision = "Rev A"
source_stage = "pre_fab_electrical_safety_gate"

[inputs]
contract = "pcb/lamp_rev_a/contract.toml"
parts = "pcb/lamp_rev_a/parts.toml"
routing_seed = "pcb/lamp_rev_a/routing_seed.toml"
pin_nets = "pcb/lamp_rev_a/pin_nets.toml"
firmware_handoff = "pcb/lamp_rev_a/firmware_handoff.toml"
placement = "pcb/lamp_rev_a/placement.toml"
power_architecture = "pcb/lamp_rev_a/power_architecture.toml"
optical_architecture = "pcb/lamp_rev_a/optical_architecture.toml"

[outputs]
report_md = "pcb/lamp_rev_a/reports/electrical_validation.md"
gates_csv = "pcb/lamp_rev_a/reports/electrical_validation_gates.csv"
spice_netlist = "pcb/lamp_rev_a/reports/lamp_rev_a_power_path.spice"
simulation_handoff_md = "pcb/lamp_rev_a/reports/simulation_handoff.md"
simulation_inputs_csv = "pcb/lamp_rev_a/reports/simulation_inputs.csv"
pdn_current_paths_csv = "pcb/lamp_rev_a/reports/pdn_current_paths.csv"
thermal_power_csv = "pcb/lamp_rev_a/reports/thermal_power_budget.csv"
first_article_measurements_csv = "pcb/lamp_rev_a/reports/first_article_measurements.csv"
component_derating_csv = "pcb/lamp_rev_a/reports/component_derating.csv"
fault_fmea_csv = "pcb/lamp_rev_a/reports/fault_fmea.csv"
emc_esd_csv = "pcb/lamp_rev_a/reports/emc_esd_precompliance.csv"
i2c_bus_csv = "pcb/lamp_rev_a/reports/i2c_bus_validation.csv"
heater_protection_csv = "pcb/lamp_rev_a/reports/heater_protection_coordination.csv"
startup_safety_csv = "pcb/lamp_rev_a/reports/startup_safety.csv"
manufacturing_test_csv = "pcb/lamp_rev_a/reports/manufacturing_test_coverage.csv"
calibration_readiness_csv = "pcb/lamp_rev_a/reports/calibration_readiness.csv"
validation_traceability_csv = "pcb/lamp_rev_a/reports/validation_traceability.csv"
pdn_dc_simulation_csv = "pcb/lamp_rev_a/reports/pdn_dc_simulation.csv"
thermal_margin_simulation_csv = "pcb/lamp_rev_a/reports/thermal_margin_simulation.csv"
heater_pwm_transient_netlist = "pcb/lamp_rev_a/reports/lamp_rev_a_heater_pwm_transient.spice"
heater_pwm_transient_csv = "pcb/lamp_rev_a/reports/heater_pwm_transient_simulation.csv"
heater_thermal_transient_csv = "pcb/lamp_rev_a/reports/heater_thermal_transient_simulation.csv"
usb_inrush_startup_csv = "pcb/lamp_rev_a/reports/usb_inrush_startup_simulation.csv"
rail_load_step_netlist = "pcb/lamp_rev_a/reports/lamp_rev_a_rail_load_step.spice"
rail_load_step_csv = "pcb/lamp_rev_a/reports/rail_load_step_simulation.csv"
analog_front_end_netlist = "pcb/lamp_rev_a/reports/lamp_rev_a_analog_front_end.spice"
analog_front_end_csv = "pcb/lamp_rev_a/reports/analog_front_end_simulation.csv"

[traceability_policy]
min_items = 15
require_output_artifact = true
require_release_manifest_entry = true
require_ci_step = true
require_acceptance_criterion = true
require_release_blocking = true

[[validation_traceability]]
id = "kicad_drc_erc_connectivity"
validation_layer = "KiCad DRC/ERC/connectivity"
output_artifact = "drc.json; erc.json; release_manifest.txt"
release_manifest_entry = "drc_violations; erc_violations; real_unconnected_items"
ci_step = "LAMP Rev A materialize KiCad board; Generate LAMP Rev A fab release"
acceptance_criterion = "Zero physical DRC violations, zero ERC violations, and zero real unconnected items."
blocks_release = true
notes = "KiCad gates catch board-rule, schematic-rule, and connectivity failures before fab packaging."

[[validation_traceability]]
id = "fab_upload_package"
validation_layer = "JLCPCB fabrication and assembly package"
output_artifact = "lamp_rev_a_jlcpcb_fabrication.zip; lamp_rev_a_jlcpcb_assembly.zip; upload_bundle_checksums.sha256"
release_manifest_entry = "fabrication_bundle; assembly_bundle; bundle_checksums"
ci_step = "Generate LAMP Rev A fab release; Validate LAMP Rev A upload bundles"
acceptance_criterion = "Release tool regenerates upload bundles and validates exact ZIP contents/checksums."
blocks_release = true
notes = "This prevents a DRC-clean board from being shipped with missing or mismatched manufacturing files."

[[validation_traceability]]
id = "rail_power_budget"
validation_layer = "Rail voltage/current budget"
electrical_gate_category = "rail budget"
output_artifact = "electrical_validation_gates.csv"
release_manifest_entry = "electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Every declared rail has a known contract rail, sane voltage window, and current budget."
blocks_release = true
notes = "Rail checks are the first automated defense against overloading USB, the 3.3 V regulator, or heater rails."

[[validation_traceability]]
id = "trace_current_capacity"
validation_layer = "Trace current capacity and layer policy"
electrical_gate_category = "trace current"
output_artifact = "pdn_current_paths.csv; electrical_validation_gates.csv"
release_manifest_entry = "pdn_current_paths; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Each high-current path has routed segments on allowed layers with width/capacity margin."
blocks_release = true
notes = "This gate is not a field solver, but it catches route-source current-path mistakes before PDN simulation."

[[validation_traceability]]
id = "pdn_dc_voltage_drop"
validation_layer = "DC PDN voltage-drop/current-loss simulation"
electrical_gate_category = "pdn dc simulation"
output_artifact = "pdn_dc_simulation.csv; electrical_validation_gates.csv"
release_manifest_entry = "pdn_dc_simulation; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Every declared power/current path computes below the configured DC voltage-drop and copper-loss limits from routed trace geometry."
blocks_release = true
notes = "This is the first routed-geometry power simulation gate; it complements trace-width checks by estimating resistance, voltage drop, and I2R loss."

[[validation_traceability]]
id = "thermal_margin_simulation"
validation_layer = "Lumped electrothermal margin simulation"
electrical_gate_category = "thermal margin simulation"
output_artifact = "thermal_margin_simulation.csv; electrical_validation_gates.csv"
release_manifest_entry = "thermal_margin_simulation; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Regulator, diode, PTC, MOSFET, and routed-copper thermal nodes estimate below configured steady-state temperature and total board-loss limits."
blocks_release = true
notes = "This is a lumped thermal model, not FEA; it turns existing component power and routed copper loss into CI-gated temperature margins."

[[validation_traceability]]
id = "heater_pwm_transient_simulation"
validation_layer = "SPICE heater PWM transient simulation"
electrical_gate_category = "heater pwm transient"
output_artifact = "lamp_rev_a_heater_pwm_transient.spice; heater_pwm_transient_simulation.csv"
release_manifest_entry = "heater_pwm_transient_netlist; heater_pwm_transient_simulation"
ci_step = "LAMP Rev A SPICE operating-point check; Run LAMP Rev A release SPICE check"
acceptance_criterion = "ngspice transient measurements keep heater on-current, off-current leakage, and gate-drive levels inside configured limits."
blocks_release = true
notes = "This is the first switched-heater transient simulation gate; it catches PWM/gate-drive envelope mistakes that DC checks cannot see."

[[validation_traceability]]
id = "heater_thermal_transient_simulation"
validation_layer = "First-order heater/reaction-block thermal transient simulation"
electrical_gate_category = "heater thermal transient"
output_artifact = "heater_thermal_transient_simulation.csv; electrical_validation_gates.csv"
release_manifest_entry = "heater_thermal_transient_simulation; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation; Generate LAMP Rev A fab release"
acceptance_criterion = "Numerical thermal model reaches LAMP target temperature in time, stays below maximum/overshoot limits, and holds target inside configured error, duty, and energy limits."
blocks_release = true
notes = "This turns heater warm-up and hold behavior into a CI-gated transient model before physical thermal logging."

[[validation_traceability]]
id = "usb_inrush_startup_simulation"
validation_layer = "USB/VBUS hot-plug and 3.3 V startup transient simulation"
electrical_gate_category = "usb inrush startup"
output_artifact = "usb_inrush_startup_simulation.csv; electrical_validation_gates.csv"
release_manifest_entry = "usb_inrush_startup_simulation; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation; Generate LAMP Rev A fab release"
acceptance_criterion = "Numerical startup model keeps VBUS inrush, +5 V path inrush, 3.3 V startup time, final voltage, and overshoot inside configured limits."
blocks_release = true
notes = "This catches USB hot-plug and 3.3 V startup-envelope failures before first-article oscilloscope rail capture."

[[validation_traceability]]
id = "rail_load_step_simulation"
validation_layer = "SPICE 3.3 V rail load-step transient simulation"
electrical_gate_category = "rail load step transient"
output_artifact = "lamp_rev_a_rail_load_step.spice; rail_load_step_simulation.csv"
release_manifest_entry = "rail_load_step_netlist; rail_load_step_simulation"
ci_step = "LAMP Rev A SPICE checks; Run LAMP Rev A release SPICE checks"
acceptance_criterion = "ngspice transient measurements keep 3.3 V rail sag, recovery, and regulator/source current inside configured limits."
blocks_release = true
notes = "This simulates a simplified ESP32/Wi-Fi load burst on the 3.3 V rail so rail collapse is not only a static budget assumption."

[[validation_traceability]]
id = "analog_front_end_simulation"
validation_layer = "SPICE optical analog front-end transient simulation"
electrical_gate_category = "analog front end transient"
output_artifact = "lamp_rev_a_analog_front_end.spice; analog_front_end_simulation.csv"
release_manifest_entry = "analog_front_end_netlist; analog_front_end_simulation"
ci_step = "LAMP Rev A SPICE checks; Run LAMP Rev A release SPICE checks"
acceptance_criterion = "ngspice transient measurements keep ADC_AIN1 inside the 3.3 V analog domain while producing a detectable dark-to-light signal delta."
blocks_release = true
notes = "This is a first-order photodiode/mux/TIA/ADC signal-envelope simulation. It does not replace optical calibration, but it catches gain/range assumptions before fab."

[[validation_traceability]]
id = "component_stress_derating"
validation_layer = "Component stress and derating"
electrical_gate_category = "component derating"
output_artifact = "component_derating.csv; electrical_validation_gates.csv"
release_manifest_entry = "component_derating; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "High-risk selected parts remain inside configured voltage/current/power utilization limits."
blocks_release = true
notes = "This covers the regulator, heater fuse/diodes/MOSFET, USB ESD, capacitors, and external connector ratings."

[[validation_traceability]]
id = "usb_signal_integrity"
validation_layer = "Full-speed USB route sanity"
electrical_gate_category = "usb signal integrity"
output_artifact = "electrical_validation_gates.csv"
release_manifest_entry = "electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "USB DP/DN are known nets with top-layer route coverage, length mismatch, via, and width sanity checks."
blocks_release = true
notes = "This is a practical pre-SI gate for full-speed USB before any external SI tool is introduced."

[[validation_traceability]]
id = "i2c_ads1115_bus_validation"
validation_layer = "I2C/ADS1115 bus electrical and identity validation"
electrical_gate_category = "i2c bus"
output_artifact = "i2c_bus_validation.csv; electrical_validation_gates.csv"
release_manifest_entry = "i2c_bus; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "SDA/SCL pull-up, RC rise-time, bus speed, ADS1115 address, test points, and stuck-low first-article coverage are declared and pass configured limits."
blocks_release = true
notes = "This targets the failure mode where the analog path is electrically sane but firmware cannot read the ADS1115 over I2C."

[[validation_traceability]]
id = "heater_protection_coordination"
validation_layer = "Heater protection coordination"
electrical_gate_category = "heater protection"
output_artifact = "heater_protection_coordination.csv; electrical_validation_gates.csv"
release_manifest_entry = "heater_protection; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Heater current limits, PTC/fuse, terminal, MOSFET, TVS, external thermal cutoff, high-current paths, and first-article verification measurements are all declared and evidence-backed."
blocks_release = true
notes = "This makes the high-energy heater safety chain explicit instead of relying only on FMEA and derating rows."

[[validation_traceability]]
id = "startup_fail_closed"
validation_layer = "ESP32-S3 startup and fail-closed behavior"
electrical_gate_category = "startup safety"
output_artifact = "startup_safety.csv; electrical_validation_gates.csv"
release_manifest_entry = "startup_safety; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Boot-sensitive GPIOs and heater control defaults have declared safe states and first-article measurements."
blocks_release = true
notes = "This targets the failure mode where firmware has not started yet but the board is already powered."

[[validation_traceability]]
id = "single_fault_fmea"
validation_layer = "Single-fault/FMEA safety"
electrical_gate_category = "single fault"
output_artifact = "fault_fmea.csv; electrical_validation_gates.csv"
release_manifest_entry = "fault_fmea; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "High-severity fault modes declare mitigations, detection methods, verification measurements, and RPN scoring."
blocks_release = true
notes = "This makes heater, USB, analog, firmware, and connector fault assumptions explicit before first article."

[[validation_traceability]]
id = "emc_esd_precompliance"
validation_layer = "EMC/ESD/transient pre-compliance"
electrical_gate_category = "emc esd"
output_artifact = "emc_esd_precompliance.csv; electrical_validation_gates.csv"
release_manifest_entry = "emc_esd; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "External interfaces and noisy subsystems declare protection, return-path strategy, verification, and external analysis coverage."
blocks_release = true
notes = "This does not replace lab EMC testing; it prevents missing ESD/transient assumptions from slipping into fab release."

[[validation_traceability]]
id = "manufacturing_test_coverage"
validation_layer = "DFT/manufacturing test coverage"
electrical_gate_category = "manufacturing test"
output_artifact = "manufacturing_test_coverage.csv; electrical_validation_gates.csv"
release_manifest_entry = "manufacturing_test; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Critical power, programming, heater, I2C/ADC, optical, manual-install, and traceability checks have test coverage."
blocks_release = true
notes = "This makes the board testable when the first assembled PCBA arrives."

[[validation_traceability]]
id = "calibration_readiness"
validation_layer = "Calibration readiness"
electrical_gate_category = "calibration readiness"
output_artifact = "calibration_readiness.csv; electrical_validation_gates.csv"
release_manifest_entry = "calibration_readiness; electrical_validation_gates"
ci_step = "LAMP Rev A electrical validation"
acceptance_criterion = "Heater, ADC dark baseline, optical response, sensor identity, negative control, and firmware identity records are defined."
blocks_release = true
notes = "This connects electrical bring-up to assay calibration so a safe board can become a measurable diagnostic device."

[[validation_traceability]]
id = "spice_power_path"
validation_layer = "SPICE operating-point power-path simulation"
output_artifact = "lamp_rev_a_power_path.spice; lamp_rev_a_power_path.ngspice.log"
release_manifest_entry = "spice_netlist; simulation_handoff"
ci_step = "LAMP Rev A SPICE operating-point check; Run LAMP Rev A release SPICE check"
acceptance_criterion = "ngspice operating-point output contains the expected rail tokens and exits successfully."
blocks_release = true
notes = "This is the first actual simulation gate and will be replaced or complemented by richer PDN/thermal simulation."

[[validation_traceability]]
id = "simulation_input_package"
validation_layer = "Simulation input package completeness"
electrical_gate_category = "simulation inputs"
output_artifact = "simulation_inputs.csv; simulation_handoff.md"
release_manifest_entry = "simulation_inputs; simulation_handoff"
ci_step = "LAMP Rev A electrical validation; Generate LAMP Rev A fab release"
acceptance_criterion = "Required PDN, electrothermal, USB/SI, and EMC handoffs declare tools, inputs, and exit criteria."
blocks_release = true
notes = "This is the bridge from checklist gates to actual solver work."

[[validation_traceability]]
id = "firmware_flash_artifact"
validation_layer = "Firmware handoff and flashable artifact traceability"
output_artifact = "firmware_handoff.md; source snapshot bundle"
release_manifest_entry = "firmware_handoff; source_bundle"
ci_step = "LAMP Rev A firmware CI; Generate LAMP Rev A fab release"
acceptance_criterion = "Board pin map, firmware handoff, source snapshot, and firmware CI artifact identity are traceable."
blocks_release = true
notes = "This keeps the CAD release tied to the firmware image and pin map used during bring-up."

[simulation_input_policy]
min_handoffs = 4
required_handoff_ids = [
  "pdn_power_integrity",
  "electrothermal",
  "usb_signal_integrity",
  "emc_esd_precompliance",
]
require_recommended_tools = true
require_inputs = true
require_exit_criterion = true

[assumptions]
ambient_c = 35.0
max_board_surface_c = 85.0
allowed_trace_temp_rise_c = 20.0
outer_copper_oz = 1.0
inner_copper_oz = 0.5
trace_current_derating = 0.70
component_current_derating = 0.80
component_voltage_derating = 0.70
component_power_derating = 0.80
continuous_heater_current_ma = 1500
protected_heater_current_ma = 3000
first_article_current_limit_ma = 500

[heater_protection_policy]
min_checks = 4
continuous_current_ma = 1500
protected_current_ma = 3000
max_fault_current_ma = 3000
require_external_cutoff = true
required_evidence_ids = [
  "input_schottky",
  "heater_resettable_fuse",
  "heater_output_terminal",
  "heater_tvs",
  "heater_gate_driver",
  "heater_mosfet",
  "inline_thermal_cutoff",
  "heater_input_schottky_derating",
  "heater_ptc_derating",
  "heater_terminal_derating",
  "heater_mosfet_derating",
  "heater_tvs_derating",
  "twelve_v_input_path",
  "twelve_v_fused_path",
  "heater_supply_path",
  "heater_return_path",
]
required_measurements = [
  "heater_raw_12v_voltage",
  "heater_supply_voltage_pwm_off",
  "heater_return_pwm_off",
  "heater_pwm_idle",
]
notes = "Coordinates the high-energy heater protection chain: 12 V input diode, PTC, terminal, TVS, gate driver, low-side MOSFET, external thermal cutoff, routed high-current paths, and first-article measurements."

[pdn_dc_simulation_policy]
max_voltage_drop_mv = 150.0
max_voltage_drop_pct = 3.0
max_path_power_mw = 250.0
via_resistance_mohm = 0.5
copper_resistivity_ohm_m = 0.00000001724
copper_thickness_um_per_oz = 34.8
require_all_trace_paths = true

[thermal_margin_simulation_policy]
max_component_temp_c = 100.0
max_trace_temp_c = 70.0
max_total_board_power_w = 2.5
protection_theta_c_per_w = 70.0
trace_theta_c_per_w = 35.0
notes = "First-order lumped thermal model for pre-fab screening. Replace with electrothermal/FEA after first physical assumptions are validated."

[heater_pwm_transient_policy]
supply_voltage_v = 12.0
heater_resistance_ohm = 7.75
heater_series_resistance_ohm = 0.15
mosfet_rds_on_ohm = 0.052
mosfet_off_resistance_ohm = 10000000.0
gate_drive_high_v = 10.0
gate_drive_low_v = 0.0
gate_threshold_v = 4.0
gate_hysteresis_v = 0.5
pwm_period_ms = 10.0
pwm_on_ms = 5.0
simulation_stop_ms = 30.0
max_on_current_a = 1.60
min_on_current_a = 1.35
max_off_current_ma = 0.005
min_gate_high_v = 9.0
max_gate_low_v = 0.2
notes = "First-order switched heater path transient model for MOSFET/PWM envelope screening before first article."

[heater_thermal_transient_policy]
ambient_c = 35.0
target_c = 65.0
target_reached_c = 63.0
max_temperature_c = 70.0
max_overshoot_c = 2.0
max_warmup_s = 420.0
max_hold_error_c = 1.0
hold_window_s = 180.0
simulation_stop_s = 900.0
timestep_s = 0.5
heater_power_w = 17.4
thermal_mass_j_per_c = 80.0
thermal_resistance_c_per_w = 3.5
controller_band_c = 1.5
proportional_gain_per_c = 0.08
max_duty = 1.0
min_hold_duty = 0.0
max_hold_duty = 0.85
max_energy_wh = 4.0
notes = "First-order reaction-block/heater thermal transient model for pre-fab screening. This does not replace first-article thermal logging or enclosure-coupled FEA."

[usb_inrush_startup_policy]
vbus_nominal_v = 5.0
usb_source_resistance_ohm = 2.0
vbus_bulk_cap_u = 10.0
five_v_bulk_cap_u = 47.0
three_v_three_bulk_cap_u = 47.0
five_v_load_ma = 20.0
three_v_three_load_ma = 60.0
schottky_drop_v = 0.25
schottky_series_resistance_ohm = 0.35
regulator_dropout_v = 0.9
regulator_series_resistance_ohm = 1.2
regulated_3v3_v = 3.3
simulation_stop_ms = 80.0
timestep_ms = 0.001
max_vbus_inrush_ma = 2600.0
max_5v_inrush_ma = 1800.0
min_final_3v3_v = 3.10
max_final_3v3_v = 3.35
max_3v3_overshoot_v = 0.05
max_startup_ms = 50.0
notes = "First-order USB hot-plug and 3.3 V startup envelope model. Startup load excludes later ESP32 Wi-Fi burst current, which is covered by the rail load-step SPICE gate. This does not replace oscilloscope capture of first-article rail startup."

[rail_load_step_policy]
nominal_voltage_v = 3.3
source_resistance_ohm = 0.35
bulk_capacitance_u = 47.0
baseline_load_ma = 120
burst_load_ma = 450
burst_start_ms = 1.0
burst_width_ms = 4.0
period_ms = 8.0
simulation_stop_ms = 24.0
min_rail_voltage_v = 3.0
max_source_current_ma = 600
notes = "First-order ESP32-S3/Wi-Fi burst load-step model for the USB-derived 3.3 V rail. Replace with extracted PDN simulation after routed parasitics are exported."

[analog_front_end_policy]
adc_rail_v = 3.3
feedback_resistor_ohm = 1000000.0
feedback_cap_pf = 10.0
mux_on_resistance_ohm = 70.0
input_cap_pf = 5.0
dark_current_na = 20.0
light_current_na = 900.0
max_photocurrent_na = 2500.0
light_start_ms = 1.0
light_width_ms = 3.0
period_ms = 8.0
simulation_stop_ms = 8.0
min_signal_delta_v = 0.25
min_adc_voltage_v = 0.0
max_adc_voltage_v = 3.0
notes = "First-order optical TIA signal-envelope model from SFH2704/CD74HC4051/TLV6001/ADS1115 assumptions. Bench optical calibration remains mandatory."

[[rail_budgets]]
rail = "VBUS"
nominal_v = 5.0
min_v = 4.75
max_v = 5.25
expected_continuous_ma = 500
source_limit_ma = 500
notes = "USB 2.0 bring-up limit. Do not assume higher current without USB-C PD or external 5 V source."

[[rail_budgets]]
rail = "+5V"
nominal_v = 4.6
min_v = 4.3
max_v = 5.1
expected_continuous_ma = 450
source_limit_ma = 500
notes = "VBUS after SS34 drop; feeds only the 3.3 V regulator and local bulk capacitance."

[[rail_budgets]]
rail = "+3V3"
nominal_v = 3.3
min_v = 3.135
max_v = 3.465
expected_continuous_ma = 300
source_limit_ma = 700
notes = "ESP32-S3, ADC, mux, op amp, logic, and optical LED drive base current."

[[rail_budgets]]
rail = "+12V_RAW"
nominal_v = 12.0
min_v = 10.8
max_v = 13.2
expected_continuous_ma = 1500
source_limit_ma = 3500
notes = "External 12 V input for heater path only."

[[rail_budgets]]
rail = "+12V"
nominal_v = 11.6
min_v = 10.4
max_v = 13.2
expected_continuous_ma = 1500
source_limit_ma = 3000
notes = "Post input-Schottky heater supply before resettable fuse."

[[rail_budgets]]
rail = "HEATER_SUPPLY"
