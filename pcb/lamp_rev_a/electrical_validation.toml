[[procurement_critical_parts]]
id = "mcu_module"
role = "ESP32-S3 compute, USB device, Wi-Fi, and firmware control"
assembly_method = "machine"
risk = "Wrong module variant or unavailable module blocks firmware, USB, Wi-Fi, and all control bring-up."
required_evidence = ["lcsc_part", "footprint", "firmware_handoff", "ESP32-S3-WROOM datasheet pin map"]
notes = "Use the ESP32-S3-WROOM-1-N8 module variant matched by the firmware handoff."

[[procurement_critical_parts]]
id = "usb_c_connector"
role = "USB power input and firmware flashing/debug connection"
assembly_method = "machine"
risk = "Wrong connector footprint or unavailable connector prevents power, flashing, and recovery."
required_evidence = ["lcsc_part", "footprint", "USB-C sink CC validation", "first-article USB rail measurements"]
notes = "USB-C connector availability and footprint are order-critical for Rev A."

[[procurement_critical_parts]]
id = "usb_c_cc_resistors"
role = "USB-C sink default-current advertisement"
assembly_method = "machine"
risk = "Wrong value can prevent USB-C VBUS attachment or overstate available current."
required_evidence = ["lcsc_part", "footprint", "5.1k value", "usb_power_budget gate"]
notes = "Both CC pull-downs must be populated."

[[procurement_critical_parts]]
id = "usb_esd_protection"
role = "USB D+/D-/VBUS ESD clamp near the user-accessible connector"
assembly_method = "machine"
risk = "Missing ESD part leaves ESP32-S3 native USB pins exposed during handling."
required_evidence = ["lcsc_part", "footprint", "emc_esd_precompliance gate", "USB route sanity gate"]
notes = "This part protects the main firmware recovery interface."

[[procurement_critical_parts]]
id = "vbus_to_5v_schottky"
role = "USB VBUS to electronics +5 V isolation path"
assembly_method = "machine"
risk = "Wrong diode rating or polarity can drop electronics power or backfeed USB."
required_evidence = ["lcsc_part", "footprint", "component_derating gate", "SPICE power-path gate"]
notes = "Rev A electronics power source depends on this diode."

[[procurement_critical_parts]]
id = "dc_input_jack"
role = "Manual-install external 12 V heater power input"
assembly_method = "manual"
risk = "Wrong jack or missing manual install step blocks heater power and can create unsafe cabling."
required_evidence = ["lcsc_part", "footprint", "manual install list", "heater protection gate"]
notes = "Through-hole/manual installation must remain explicit in the fab package."

[[procurement_critical_parts]]
id = "three_v_three_regulator"
role = "USB-derived +3.3 V regulator for ESP32, ADC, mux, and logic"
assembly_method = "machine"
risk = "Wrong regulator or unavailable package can cause boot failures or overheating."
required_evidence = ["lcsc_part", "footprint", "thermal_margin_simulation gate", "rail_load_step simulation"]
notes = "LDO thermal margin is tracked elsewhere; this gate keeps ordering/footprint evidence present."

[[procurement_critical_parts]]
id = "regulator_bulk_caps"
role = "Bulk capacitance for VBUS, +5 V, +3.3 V, and 12 V input rails"
assembly_method = "machine"
risk = "Wrong capacitance or missing parts can create startup droop, USB inrush, or regulator instability."
required_evidence = ["lcsc_part", "footprint", "usb_inrush_startup simulation", "rail_load_step simulation"]
notes = "Bulk capacitance links directly to startup and load-step simulations."

[[procurement_critical_parts]]
id = "adc"
role = "ADS1115 optical/thermal measurement ADC"
assembly_method = "machine"
risk = "Wrong ADC or address variant breaks the measurement path and firmware identity check."
required_evidence = ["lcsc_part", "footprint", "i2c_bus_validation gate", "analog_front_end simulation"]
notes = "The assay signal chain depends on this part being the expected I2C device."

[[procurement_critical_parts]]
id = "optical_mux"
role = "Eight-channel optical detector multiplexing"
assembly_method = "machine"
risk = "Wrong mux leakage/on-resistance can hide or distort optical signal."
required_evidence = ["lcsc_part", "footprint", "analog range gate", "optical noise/crosstalk gates"]
notes = "Mux procurement ties directly to optical calibration readiness."

[[procurement_critical_parts]]
id = "turbidity_emitters"
role = "650 nm turbidity LED emitters"
assembly_method = "machine"
risk = "Wrong wavelength, polarity, or availability invalidates optical response assumptions."
required_evidence = ["lcsc_part", "footprint", "optical architecture", "calibration readiness gate"]
notes = "Emitter group must match optical architecture and calibration plan."

[[procurement_critical_parts]]
id = "photodiodes"
role = "Turbidity detector photodiodes"
assembly_method = "machine"
risk = "Wrong detector package or spectral response invalidates the optical readout path."
required_evidence = ["lcsc_part", "footprint", "optical architecture", "analog front-end simulation"]
notes = "Detector orientation and package are first-article calibration risks."

[[procurement_critical_parts]]
id = "optical_tia_opamp"
role = "Shared transimpedance amplifier"
assembly_method = "machine"
risk = "Wrong op amp input bias/output swing can saturate or bury the optical signal."
required_evidence = ["lcsc_part", "footprint", "component_derating gate", "analog front-end simulation"]
notes = "TIA op amp procurement is critical for measurable optical output."

[[procurement_critical_parts]]
id = "heater_gate_driver"
role = "12 V MOSFET gate driver"
assembly_method = "machine"
risk = "Wrong gate-driver threshold or package can leave heater control inactive or unsafe."
required_evidence = ["lcsc_part", "footprint", "heater PWM transient simulation", "startup safety gate"]
notes = "This part bridges ESP32 logic and the high-energy heater MOSFET."

[[procurement_critical_parts]]
id = "heater_mosfet"
role = "Low-side switched heater current path"
assembly_method = "machine"
risk = "Wrong MOSFET Rds(on), package, or polarity can overheat or fail unsafe."
required_evidence = ["lcsc_part", "footprint", "thermal_margin_simulation gate", "single_fault_fmea gate"]
notes = "This is one of the highest-energy components on Rev A."

[[procurement_critical_parts]]
id = "heater_output_terminal"
role = "Manual-install external heater terminal"
assembly_method = "manual"
risk = "Wrong terminal pitch/current rating or missing manual install can make heater wiring unsafe."
required_evidence = ["lcsc_part", "footprint", "manual install list", "heater protection gate"]
notes = "The terminal is manually installed and must remain visible in procurement and assembly docs."

[[procurement_critical_parts]]
id = "heater_resettable_fuse"
role = "PTC/resettable fuse for heater supply"
assembly_method = "machine"
risk = "Wrong hold/trip current can nuisance trip or fail to protect heater wiring."
required_evidence = ["lcsc_part", "footprint", "heater protection gate", "component_derating gate"]
notes = "Protection coordination depends on this exact part class."

[[procurement_critical_parts]]
id = "heater_tvs"
role = "Heater supply transient clamp"
assembly_method = "machine"
risk = "Wrong clamp voltage or package leaves heater cable transients unbounded."
required_evidence = ["lcsc_part", "footprint", "emc_esd_precompliance gate", "heater protection gate"]
notes = "TVS choice is part of heater-cable transient control."

[[procurement_critical_parts]]
id = "input_schottky"
role = "12 V input reverse/backfeed protection path"
assembly_method = "machine"
risk = "Wrong diode rating or polarity can disable heater power or overheat on current draw."
required_evidence = ["lcsc_part", "footprint", "component_derating gate", "heater protection gate"]
notes = "This part sits in the high-current 12 V input path."

[[procurement_critical_parts]]
id = "inline_thermal_cutoff"
role = "External normally-closed thermal cutoff in series with heater assembly"
assembly_method = "external"
risk = "Missing external cutoff removes the physical last-resort heater safety layer."
required_evidence = ["external_safety_part", "lcsc_part", "installation note", "first-article heater safety check"]
notes = "This is intentionally external to the PCB and must be installed on the heater block/carrier."

[i2c_bus_policy]
sda_net = "SDA"
scl_net = "SCL"
pullup_part_id = "resistor_4k7"
adc_part_id = "adc"
required_device = "ADS1115"
required_address = "0x48"
pullup_ohm = 4700.0
bus_capacitance_pf = 100.0
bus_speed_hz = 100000
max_bus_speed_hz = 100000
max_rise_time_ns = 1000.0
rail_v = 3.3
min_idle_high_v = 2.31
required_test_points = ["TP_SDA", "TP_SCL", "TP_3V3", "TP_GND"]
required_measurements = ["i2c_sda_idle", "i2c_scl_idle", "i2c_ads1115_identity"]
notes = "Standard-mode I2C validation for the ADS1115 bus. This catches wrong pull-up assumptions, missing bus access, and firmware/device identity gaps before first article."

[[external_analysis_handoffs]]
id = "pdn_power_integrity"
tool_class = "PDN / power integrity"
recommended_tools = ["Ki-PIDA", "Altium PDN Analyzer", "Cadence Sigrity", "Ansys SIwave"]
inputs = ["lamp_rev_a.kicad_pcb", "electrical_validation.toml", "routing_seed.toml", "gerbers"]
exit_criterion = "Voltage drop and current density pass for VBUS, +5V, +3V3, +12V_RAW, +12V, HEATER_SUPPLY, and HEATER_P at the currents in this file."

[[external_analysis_handoffs]]
id = "electrothermal"
tool_class = "thermal / electrothermal"
recommended_tools = ["Cadence Celsius", "Ansys Icepak/SIwave", "PCB-Investigator", "bench thermography"]
inputs = ["heater path copper", "SS34 losses", "AMS1117 losses", "AO3400A losses"]
exit_criterion = "Regulator, input diode, PTC, MOSFET, terminal, and copper remain below touch/material limits at normal heater current."

[[external_analysis_handoffs]]
id = "usb_signal_integrity"
tool_class = "signal integrity"
recommended_tools = ["KiCad impedance calculator", "Saturn PCB Toolkit", "HyperLynx", "oscilloscope eye/edge check"]
inputs = ["USB_DP", "USB_DN", "4-layer stackup"]
exit_criterion = "USB D+/D- routing has controlled-enough geometry for full-speed USB and passes firmware enumeration on first article."

[[external_analysis_handoffs]]
id = "emc_esd_precompliance"
tool_class = "EMC / ESD pre-compliance"
recommended_tools = ["ESD simulator", "near-field EMI probe", "spectrum analyzer", "oscilloscope transient capture", "IEC 61000-4-2 pre-scan"]
inputs = ["USB-C connector", "12 V input cable", "heater cable", "ESP32-S3 Wi-Fi active state", "analog ADC baseline"]
exit_criterion = "USB, 12 V input, heater wiring, Wi-Fi activity, and optical analog front end survive/operate through pre-compliance stress without rail latchup, unsafe heater state, USB loss requiring rework, or invalid ADC baseline drift."

[[manual_first_article_gates]]
id = "unpowered_resistance"
description = "Measure rail-to-GND resistance before applying power."
pass_criterion = "No low-ohm short on VBUS, +5V, +3V3, +12V_RAW, +12V, HEATER_SUPPLY, or HEATER_P."

[[manual_first_article_gates]]
id = "current_limited_usb"
description = "Power USB/VBUS with current limit before attaching 12 V."
pass_criterion = "+5V and +3V3 settle in range and current remains below the USB bring-up limit."

[[manual_first_article_gates]]
id = "current_limited_heater"
description = "Apply 12 V heater power with bench current limit and external thermal cutoff installed."
pass_criterion = "Heater current, MOSFET temperature, diode temperature, and terminal temperature remain inside this validation budget."

[[first_article_measurements]]
id = "power_off_vbus_resistance"
stage = "power_off"
order = 10
test_point = "TP_VBUS"
net = "VBUS"
measurement = "resistance_to_gnd"
pass_criterion = "No low-ohm short to TP_GND before USB power is applied."
notes = "Measure with board unpowered and heater supply disconnected."

[[first_article_measurements]]
id = "power_off_3v3_resistance"
stage = "power_off"
order = 20
test_point = "TP_3V3"
net = "+3V3"
measurement = "resistance_to_gnd"
pass_criterion = "No low-ohm short to TP_GND before USB power is applied."
notes = "This catches reversed/bridged logic rail assembly defects before applying USB power."

[[first_article_measurements]]
id = "usb_vbus_voltage"
stage = "usb_power_only"
order = 30
test_point = "TP_VBUS"
net = "VBUS"
measurement = "voltage_to_gnd"
min_v = 4.75
max_v = 5.25
current_limit_ma = 500
pass_criterion = "VBUS enters the configured voltage window without the supply current limit folding back."
notes = "Use USB/electronics-only power. Do not connect 12 V heater power yet."

[[first_article_measurements]]
id = "usb_5v_voltage"
stage = "usb_power_only"
order = 40
test_point = "TP_5V"
net = "+5V"
measurement = "voltage_to_gnd"
min_v = 4.30
max_v = 5.10
current_limit_ma = 500
pass_criterion = "+5V is present after the VBUS Schottky path and remains below the configured source limit."
notes = "Expected lower than VBUS because Rev A uses a Schottky isolation diode."

[[first_article_measurements]]
id = "usb_3v3_voltage"
stage = "usb_power_only"
order = 50
test_point = "TP_3V3"
net = "+3V3"
measurement = "voltage_to_gnd"
min_v = 3.135
max_v = 3.465
current_limit_ma = 500
pass_criterion = "+3V3 regulator is in range before flashing or enabling heater firmware."
notes = "Stop if AMS1117 temperature rises quickly during this low-current step."

[[first_article_measurements]]
id = "esp_en_idle"
stage = "usb_power_only"
order = 52
test_point = "TP_EN"
net = "ESP_EN"
measurement = "logic_level"
min_v = 3.00
max_v = 3.465
current_limit_ma = 500
pass_criterion = "ESP_EN is in a valid released/reset-testable state before flashing."
notes = "A bad EN state can look like a power failure even when +3V3 is correct."

[[first_article_measurements]]
id = "esp_gpio0_boot_idle"
stage = "usb_power_only"
order = 54
test_point = "TP_BOOT"
net = "ESP_GPIO0"
measurement = "logic_level"
min_v = 3.00
max_v = 3.465
current_limit_ma = 500
pass_criterion = "GPIO0 idles high for normal boot and can still be forced low only for bootloader entry."
notes = "This protects the firmware recovery path before relying on USB flashing."

[[first_article_measurements]]
id = "heater_raw_12v_voltage"
stage = "heater_power_present_pwm_off"
order = 60
test_point = "TP_12V"
net = "+12V_RAW"
measurement = "voltage_to_gnd"
min_v = 10.80
max_v = 13.20
current_limit_ma = 3000
pass_criterion = "External 12 V input is in range while firmware keeps heater PWM inactive."
notes = "Bench supply current limit must be at or below the protected heater current budget."

[[first_article_measurements]]
id = "heater_supply_voltage_pwm_off"
stage = "heater_power_present_pwm_off"
order = 70
test_point = "TP_HEATER_SUPPLY"
net = "HEATER_SUPPLY"
measurement = "voltage_to_gnd"
min_v = 10.40
max_v = 13.20
current_limit_ma = 3000
pass_criterion = "Fused heater supply is in range before commanding any heater current."
notes = "External inline thermal cutoff must be installed before this stage."

[[first_article_measurements]]
id = "heater_return_pwm_off"
stage = "heater_power_present_pwm_off"
order = 80
test_point = "TP_HEATER"
net = "HEATER_P"
measurement = "voltage_to_gnd"
min_v = 0.00
max_v = 0.25
current_limit_ma = 3000
pass_criterion = "Low-side return remains off with PWM inactive."
notes = "A high voltage here before firmware enables PWM means the MOSFET path is not fail-closed."

[[first_article_measurements]]
id = "heater_pwm_idle"
stage = "heater_power_present_pwm_off"
order = 90
test_point = "TP_PWM"
net = "HEATER_PWM"
measurement = "logic_level"
min_v = 0.00
max_v = 0.40
current_limit_ma = 500
pass_criterion = "Firmware leaves heater gate drive low during idle and boot."
notes = "Verify before connecting a high-power heater load."

[[first_article_measurements]]
id = "analog_adc_idle"
stage = "firmware_idle"
order = 100
test_point = "TP_ADC"
net = "ADC_AIN1"
measurement = "voltage_to_gnd"
min_v = 0.00
max_v = 3.30
current_limit_ma = 500
pass_criterion = "ADC input stays inside the 3.3 V analog domain."
notes = "Use dark optical state first, then repeat during a one-channel 650 nm emitter check."

[[first_article_measurements]]
id = "i2c_sda_idle"
stage = "firmware_idle"
order = 110
test_point = "TP_SDA"
net = "SDA"
measurement = "logic_level"
min_v = 3.00
max_v = 3.465
current_limit_ma = 500
pass_criterion = "SDA idles high on the 3.3 V domain and is not stuck low."
notes = "A stuck-low bus blocks ADS1115 bring-up."

[[first_article_measurements]]
id = "i2c_scl_idle"
stage = "firmware_idle"
order = 120
test_point = "TP_SCL"
net = "SCL"
measurement = "logic_level"
min_v = 3.00
max_v = 3.465
current_limit_ma = 500
pass_criterion = "SCL idles high on the 3.3 V domain and is not stuck low."
notes = "A stuck-low bus blocks ADS1115 bring-up."

[[first_article_measurements]]
id = "i2c_ads1115_identity"
stage = "firmware_idle"
order = 125
test_point = "TP_SDA"
net = "SDA"
measurement = "i2c_device_identity"
current_limit_ma = 500
pass_criterion = "ADS1115 responds at 0x48 and firmware refuses assay start if the device is absent."
notes = "Device identity closes the gap between a good-looking I2C waveform and the ADC actually being available to firmware."
