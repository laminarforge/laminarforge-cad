required_measurements = ["analog_adc_idle"]
required_outputs = ["optical_slot_response.csv", "slot_mapping_check.md"]
notes = "First-order channel isolation and mux/ADC settling gate. It does not replace dry fixture calibration, but it keeps gross optical crosstalk assumptions inside the release package."

[optical_noise_margin_policy]
