allowed_assembly_methods = ["machine", "manual"]
require_pin_net_assignments = true
require_placement = true
require_orientation_note = true
required_check_ids = [
  "usb_c_receptacle_pinout",
  "dc_input_jack_pinout",
  "heater_terminal_pinout",
  "vbus_schottky_polarity",
  "input_schottky_polarity",
  "heater_tvs_polarity",
  "heater_mosfet_pinout",
  "heater_gate_driver_pinout",
  "ldo_pinout",
  "ads1115_pinout",
  "optical_mux_pinout",
  "tia_opamp_pinout",
]
notes = "Pin-net and orientation checks for connector/manual and polarity-sensitive Rev A parts."

[[connector_polarity_checks]]
id = "usb_c_receptacle_pinout"
part_id = "usb_c_connector"
reference = "J1"
role = "USB power, flashing, data, and shield/ground interface"
assembly_method = "machine"
polarity_type = "connector_pinout"
required_nets = ["VBUS", "GND", "USB_DP", "USB_DN", "USB_CC1", "USB_CC2"]
orientation_evidence = ["pin_nets.toml J1 assignment", "USB-C footprint orientation", "USB rail and enumeration first article"]
verification_method = "Inspect J1 orientation, verify CC Rd behavior, and confirm USB enumeration plus VBUS/+5V/+3V3 first-article measurements."
notes = "USB-C can pass ERC while mirrored or pad-mapped incorrectly; both plug orientations must map to the same DP/DN/VBUS/GND semantics."
[connector_polarity_checks.required_pins]
"A5" = "USB_CC1"
"B5" = "USB_CC2"
"A6" = "USB_DP"
"B6" = "USB_DP"
"A7" = "USB_DN"
"B7" = "USB_DN"
"A9B4" = "VBUS"
"B9A4" = "VBUS"
"A12B1" = "GND"
"B12A1" = "GND"

[[connector_polarity_checks]]
id = "dc_input_jack_pinout"
part_id = "dc_input_jack"
reference = "J2"
role = "External 12 V heater input"
assembly_method = "manual"
polarity_type = "power_connector_pinout"
required_nets = ["+12V_RAW", "GND"]
orientation_evidence = ["pin_nets.toml J2 assignment", "manual_install_parts.csv", "12 V polarity first-article measurement"]
verification_method = "Continuity-check J2 center/contact pin to TP_12V and sleeve pins to TP_GND before applying heater power."
notes = "Manual jack wiring is a high-energy polarity risk because the 12 V domain is outside USB protection."
[connector_polarity_checks.required_pins]
"1" = "+12V_RAW"
"2" = "GND"
"3" = "GND"

[[connector_polarity_checks]]
id = "heater_terminal_pinout"
part_id = "heater_output_terminal"
reference = "J3"
role = "External heater supply and switched return terminal"
assembly_method = "manual"
polarity_type = "heater_connector_pinout"
required_nets = ["HEATER_SUPPLY", "HEATER_P"]
orientation_evidence = ["pin_nets.toml J3 assignment", "manual_install_parts.csv", "heater protection first-article measurements"]
verification_method = "Continuity-check J3 pin 1 to TP_HEATER_SUPPLY and pin 2 to TP_HEATER before connecting the external heater."
notes = "Swapping the heater terminal changes where the MOSFET and protection chain sit relative to the external heater."
[connector_polarity_checks.required_pins]
"1" = "HEATER_SUPPLY"
"2" = "HEATER_P"

[[connector_polarity_checks]]
id = "vbus_schottky_polarity"
part_id = "vbus_to_5v_schottky"
reference = "D1"
role = "USB VBUS to protected +5 V Schottky path"
assembly_method = "machine"
polarity_type = "diode_polarity"
required_nets = ["VBUS", "+5V"]
orientation_evidence = ["pin_nets.toml D1 assignment", "diode polarity mark", "USB 5 V first-article measurement"]
verification_method = "Verify diode orientation from VBUS to +5V and confirm +5V rises from USB VBUS with no reverse feed."
notes = "A reversed VBUS Schottky can block electronics power or backfeed USB."
[connector_polarity_checks.required_pins]
"1" = "VBUS"
"2" = "+5V"

[[connector_polarity_checks]]
id = "input_schottky_polarity"
part_id = "input_schottky"
reference = "D13"
role = "12 V reverse-protection diode into heater rail"
assembly_method = "machine"
polarity_type = "diode_polarity"
required_nets = ["+12V_RAW", "+12V"]
orientation_evidence = ["pin_nets.toml D13 assignment", "diode polarity mark", "12 V protected rail first-article measurement"]
verification_method = "Verify D13 orientation from +12V_RAW to +12V and confirm protected 12 V appears only with correct input polarity."
notes = "A reversed or swapped 12 V Schottky breaks or defeats heater input protection."
[connector_polarity_checks.required_pins]
"1" = "+12V_RAW"
"2" = "+12V"

[[connector_polarity_checks]]
id = "heater_tvs_polarity"
