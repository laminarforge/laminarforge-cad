failure_mode = "USB D+/D- short, excessive skew, missing ESD path, or bad connector assembly."
cause = "Assembly defect, connector damage, or routing-source regression."
local_effect = "USB enumeration fails or stress reaches ESP32-S3 native USB pins."
system_effect = "Board cannot be flashed or debugged over USB."
severity = 6
occurrence = 4
detection = 4
hardware_mitigations = ["usb_esd_protection", "usb_signal_integrity"]
firmware_mitigations = ["firmware artifact package includes flash runbook and build identity"]
detection_methods = ["USB enumeration during bring-up", "CI USB route sanity gate", "visual connector inspection"]
verification_measurements = ["usb_vbus_voltage"]
notes = "Full-speed USB is less safety-critical than the heater path, but it is critical to board recovery and flashing."

[[single_fault_checks]]
id = "i2c_bus_stuck_low"
subsystem = "optical_detection"
failure_mode = "I2C SDA/SCL stuck low or pulled to the wrong rail."
cause = "Solder bridge, failed ADS1115, failed pull-up, or firmware pin mode error."
local_effect = "ADS1115 is unreachable and optical/temperature readings are unavailable."
system_effect = "Firmware must not treat missing sensor data as a valid LAMP result."
severity = 5
occurrence = 4
detection = 3
hardware_mitigations = ["i2c_pullup_power_derating", "gpio_domain"]
firmware_mitigations = ["I2C probe timeout", "dashboard/status exposes sensor fault before test start"]
detection_methods = ["TP_SDA and TP_SCL idle-high checks", "firmware I2C scan"]
verification_measurements = ["i2c_sda_idle", "i2c_scl_idle"]
notes = "This is mostly a functional safety fault: the board should fail closed instead of reporting a false assay result."

[[trace_current_paths]]
id = "vbus_electronics_path"
net = "VBUS"
current_ma = 500
min_width_mm = 0.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "USB input current path to VBUS Schottky and rail bulk capacitance."

[[trace_current_paths]]
id = "five_v_electronics_path"
net = "+5V"
current_ma = 450
min_width_mm = 0.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Post-Schottky electronics 5 V path."

[[trace_current_paths]]
id = "three_v_three_distribution"
net = "+3V3"
current_ma = 300
min_width_mm = 0.50
neckdown_min_width_mm = 0.20
max_neckdown_length_mm = 2.00
allowed_layers = ["F.Cu", "In2.Cu", "B.Cu"]
notes = "3.3 V logic distribution."

[[trace_current_paths]]
id = "twelve_v_input_path"
net = "+12V_RAW"
current_ma = 1500
min_width_mm = 1.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "12 V input from barrel jack to input protection and test point."

[[trace_current_paths]]
id = "twelve_v_fused_path"
net = "+12V"
current_ma = 1500
min_width_mm = 1.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Post-Schottky heater supply to the PTC."

[[trace_current_paths]]
id = "heater_supply_path"
net = "HEATER_SUPPLY"
current_ma = 1500
min_width_mm = 2.00
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Fused heater supply to J3."

[[trace_current_paths]]
id = "heater_return_path"
net = "HEATER_P"
current_ma = 1500
min_width_mm = 2.00
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Switched heater return path from J3 to MOSFET drain."

[[heater_protection_checks]]
id = "normal_heater_pwm_chain"
stage = "normal_pwm_operation"
current_ma = 1500
required_parts = ["input_schottky", "heater_resettable_fuse", "heater_output_terminal", "heater_tvs", "heater_gate_driver", "heater_mosfet", "inline_thermal_cutoff"]
required_paths = ["twelve_v_input_path", "twelve_v_fused_path", "heater_supply_path", "heater_return_path"]
required_measurements = ["heater_raw_12v_voltage", "heater_supply_voltage_pwm_off", "heater_return_pwm_off", "heater_pwm_idle"]
trip_or_limit = "Normal heater current must stay at or below the continuous 1.5 A validation budget before any higher-power profile is allowed."
pass_criterion = "All heater-chain protection parts and routed current paths are present, and PWM-off first-article measurements pass before heater enable."
notes = "This is the nominal heater chain check for controlled PWM operation."

[[heater_protection_checks]]
id = "protected_heater_fault_chain"
stage = "current_limited_fault_screen"
current_ma = 3000
required_parts = ["heater_resettable_fuse", "heater_output_terminal", "heater_tvs", "inline_thermal_cutoff"]
required_paths = ["twelve_v_fused_path", "heater_supply_path", "heater_return_path"]
required_measurements = ["heater_raw_12v_voltage", "heater_supply_voltage_pwm_off"]
trip_or_limit = "Bench supply current limit and PTC protected-current budget must be at or below 3 A during first article."
pass_criterion = "A heater-terminal short or low-resistance load cannot be tested without current limiting, PTC evidence, and external thermal cutoff installed."
notes = "This covers cable/terminal shorts and excessive heater warm-up current."

[[heater_protection_checks]]
id = "external_thermal_cutoff_required"
stage = "manual_install_before_12v"
current_ma = 0
required_parts = ["inline_thermal_cutoff", "heater_output_terminal"]
required_paths = ["heater_supply_path", "heater_return_path"]
required_measurements = ["heater_supply_voltage_pwm_off"]
trip_or_limit = "External normally-closed thermal cutoff must be installed in series with the heater assembly before 12 V power."
pass_criterion = "Manual-install inspection confirms the cutoff is physically mounted on the heater block/carrier, not just declared in the schematic."
notes = "The PCB alone cannot make the external heater safe; the release must block unprotected heater bring-up."

[[heater_protection_checks]]
id = "mosfet_fail_closed_detection"
stage = "heater_power_present_pwm_off"
current_ma = 1500
required_parts = ["heater_gate_driver", "heater_mosfet", "heater_resettable_fuse", "inline_thermal_cutoff"]
required_paths = ["heater_supply_path", "heater_return_path"]
required_measurements = ["heater_return_pwm_off", "heater_pwm_idle", "heater_supply_voltage_pwm_off"]
trip_or_limit = "PWM-off HEATER_P and GATE_DRV checks must detect a stuck-on MOSFET or active gate before connecting a high-power heater load."
pass_criterion = "Gate drive remains low and the switched heater return remains inactive with 12 V present and heater_enabled false."
notes = "This catches the most dangerous single-board heater-control fault before a real assay run."

[gpio_domain]
mcu_reference = "U1"
logic_max_v = 3.6
forbidden_high_voltage_nets = ["+12V_RAW", "+12V", "HEATER_SUPPLY", "HEATER_P", "VBUS", "+5V"]
notes = "ESP32-S3 module pins must not directly touch USB VBUS, 5 V, or heater rails."

[[analog_checks]]
