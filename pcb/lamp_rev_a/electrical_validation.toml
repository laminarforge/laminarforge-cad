orientation_evidence = ["pin_nets.toml D10 assignment", "TVS polarity mark", "heater protection validation"]
verification_method = "Inspect TVS orientation and confirm HEATER_SUPPLY is not shorted to GND before powered bring-up."
notes = "Wrong TVS orientation can short the heater rail or leave the cable unprotected."
[connector_polarity_checks.required_pins]
"1" = "HEATER_SUPPLY"
"2" = "GND"

[[connector_polarity_checks]]
id = "heater_mosfet_pinout"
