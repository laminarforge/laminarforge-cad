max_total_board_power_w = 2.5
protection_theta_c_per_w = 70.0
trace_theta_c_per_w = 35.0
notes = "First-order lumped thermal model for pre-fab screening. Replace with electrothermal/FEA after first physical assumptions are validated."

[heater_pwm_transient_policy]
