[package]
name = "lamp_rev_a_electrical_validation"
ticket = "T-55545112"
revision = "Rev A"
source_stage = "pre_fab_electrical_safety_gate"

[inputs]
contract = "pcb/lamp_rev_a/contract.toml"
parts = "pcb/lamp_rev_a/parts.toml"
routing_seed = "pcb/lamp_rev_a/routing_seed.toml"
pin_nets = "pcb/lamp_rev_a/pin_nets.toml"
firmware_handoff = "pcb/lamp_rev_a/firmware_handoff.toml"
placement = "pcb/lamp_rev_a/placement.toml"
power_architecture = "pcb/lamp_rev_a/power_architecture.toml"
optical_architecture = "pcb/lamp_rev_a/optical_architecture.toml"

[outputs]
report_md = "pcb/lamp_rev_a/reports/electrical_validation.md"
gates_csv = "pcb/lamp_rev_a/reports/electrical_validation_gates.csv"
spice_netlist = "pcb/lamp_rev_a/reports/lamp_rev_a_power_path.spice"
simulation_handoff_md = "pcb/lamp_rev_a/reports/simulation_handoff.md"
pdn_current_paths_csv = "pcb/lamp_rev_a/reports/pdn_current_paths.csv"
thermal_power_csv = "pcb/lamp_rev_a/reports/thermal_power_budget.csv"
first_article_measurements_csv = "pcb/lamp_rev_a/reports/first_article_measurements.csv"
component_derating_csv = "pcb/lamp_rev_a/reports/component_derating.csv"
fault_fmea_csv = "pcb/lamp_rev_a/reports/fault_fmea.csv"

[assumptions]
ambient_c = 35.0
max_board_surface_c = 85.0
allowed_trace_temp_rise_c = 20.0
outer_copper_oz = 1.0
inner_copper_oz = 0.5
trace_current_derating = 0.70
component_current_derating = 0.80
component_voltage_derating = 0.70
component_power_derating = 0.80
continuous_heater_current_ma = 1500
protected_heater_current_ma = 3000
first_article_current_limit_ma = 500

[[rail_budgets]]
rail = "VBUS"
nominal_v = 5.0
min_v = 4.75
max_v = 5.25
expected_continuous_ma = 500
source_limit_ma = 500
notes = "USB 2.0 bring-up limit. Do not assume higher current without USB-C PD or external 5 V source."

[[rail_budgets]]
rail = "+5V"
nominal_v = 4.6
min_v = 4.3
max_v = 5.1
expected_continuous_ma = 450
source_limit_ma = 500
notes = "VBUS after SS34 drop; feeds only the 3.3 V regulator and local bulk capacitance."

[[rail_budgets]]
rail = "+3V3"
nominal_v = 3.3
min_v = 3.135
max_v = 3.465
expected_continuous_ma = 300
source_limit_ma = 700
notes = "ESP32-S3, ADC, mux, op amp, logic, and optical LED drive base current."

[[rail_budgets]]
rail = "+12V_RAW"
nominal_v = 12.0
min_v = 10.8
max_v = 13.2
expected_continuous_ma = 1500
source_limit_ma = 3500
notes = "External 12 V input for heater path only."

[[rail_budgets]]
rail = "+12V"
nominal_v = 11.6
min_v = 10.4
max_v = 13.2
expected_continuous_ma = 1500
source_limit_ma = 3000
notes = "Post input-Schottky heater supply before resettable fuse."

[[rail_budgets]]
rail = "HEATER_SUPPLY"
nominal_v = 11.6
min_v = 10.4
max_v = 13.2
expected_continuous_ma = 1500
source_limit_ma = 3000
notes = "Fused heater supply at J3 pin 1."

[[rail_budgets]]
rail = "HEATER_P"
nominal_v = 11.6
min_v = 0.0
max_v = 13.2
expected_continuous_ma = 1500
source_limit_ma = 3000
notes = "Switched heater return through the low-side MOSFET."

[[linear_regulators]]
id = "u3_3v3_ldo"
part_id = "three_v_three_regulator"
input_rail = "+5V"
output_rail = "+3V3"
vin_nominal_v = 4.6
vout_nominal_v = 3.3
load_ma = 300
current_rating_ma = 1000
theta_ja_c_per_w = 65.0
max_temp_rise_c = 35.0
notes = "AMS1117 thermal budget assumes SOT-223 copper pour and USB-powered electronics only."

[[protection_checks]]
id = "usb_vbus_schottky"
part_id = "vbus_to_5v_schottky"
path = "VBUS to +5V"
current_ma = 500
voltage_v = 5.25
current_rating_ma = 3000
voltage_rating_v = 40.0
voltage_drop_v = 0.50
max_power_w = 1.0
notes = "SS34 VBUS isolation diode dissipates worst-case USB electronics current only."

[[protection_checks]]
id = "heater_input_schottky"
part_id = "input_schottky"
path = "+12V_RAW to +12V"
current_ma = 1500
voltage_v = 13.2
current_rating_ma = 3000
voltage_rating_v = 40.0
voltage_drop_v = 0.50
max_power_w = 1.5
notes = "Normal heater current limit; 3 A is treated as protected/fused current, not continuous design current."

[[protection_checks]]
id = "heater_ptc"
part_id = "heater_resettable_fuse"
path = "+12V to HEATER_SUPPLY"
current_ma = 1500
voltage_v = 13.2
current_rating_ma = 3000
voltage_rating_v = 36.0
voltage_drop_v = 0.15
max_power_w = 0.6
notes = "3 A hold-current PTC must still be bench-validated against the heater warm-up profile."

[[protection_checks]]
id = "heater_terminal"
part_id = "heater_output_terminal"
path = "HEATER_SUPPLY/HEATER_P external heater connector"
current_ma = 3000
voltage_v = 13.2
current_rating_ma = 16000
voltage_rating_v = 250.0
voltage_drop_v = 0.0
max_power_w = 0.2
notes = "Terminal rating margin is high; manual installation torque and wire gauge remain bring-up checks."

[[mosfet_checks]]
id = "heater_low_side_fet"
part_id = "heater_mosfet"
drain_source_voltage_v = 13.2
continuous_current_ma = 1500
pulsed_current_ma = 3000
rds_on_mohm = 52.0
current_rating_ma = 5700
voltage_rating_v = 30.0
package_theta_ja_c_per_w = 125.0
max_temp_rise_c = 35.0
notes = "AO3400A loss estimate at 10-12 V gate drive from TC4427; prototype must measure MOSFET case temperature."

[[component_deratings]]
id = "u3_ldo_derating"
part_id = "three_v_three_regulator"
stress_class = "linear regulator thermal/current"
operating_voltage_v = 4.6
rated_voltage_v = 15.0
operating_current_ma = 300
rated_current_ma = 1000
operating_power_w = 0.390
rated_power_w = 0.538
estimated_temp_rise_c = 25.35
max_temp_rise_c = 35.0
notes = "AMS1117 stress uses the same 300 mA electronics load and 65 C/W thermal model as the thermal table."

[[component_deratings]]
id = "vbus_schottky_derating"
part_id = "vbus_to_5v_schottky"
stress_class = "USB input isolation diode"
operating_voltage_v = 5.25
rated_voltage_v = 40.0
operating_current_ma = 500
rated_current_ma = 3000
operating_power_w = 0.250
rated_power_w = 1.0
notes = "SS34 VBUS diode derating at the first-article USB current limit."

[[component_deratings]]
id = "heater_input_schottky_derating"
part_id = "input_schottky"
stress_class = "heater input isolation diode"
operating_voltage_v = 13.2
rated_voltage_v = 40.0
operating_current_ma = 1500
rated_current_ma = 3000
operating_power_w = 0.750
rated_power_w = 1.5
notes = "SS34 12 V input diode derating at normal heater current, not the protected fault limit."

[[component_deratings]]
id = "heater_ptc_derating"
part_id = "heater_resettable_fuse"
stress_class = "heater resettable fuse"
operating_voltage_v = 13.2
rated_voltage_v = 36.0
operating_current_ma = 1500
rated_current_ma = 3000
operating_power_w = 0.225
rated_power_w = 0.6
notes = "PTC check treats 1.5 A as normal current and 3 A as the first-article current-limit ceiling."

[[component_deratings]]
id = "heater_terminal_derating"
part_id = "heater_output_terminal"
stress_class = "manual heater connector"
operating_voltage_v = 13.2
rated_voltage_v = 250.0
operating_current_ma = 3000
rated_current_ma = 16000
operating_power_w = 0.0
rated_power_w = 0.2
notes = "Connector has large electrical margin; torque, wire gauge, and manual installation remain physical bring-up checks."

[[component_deratings]]
id = "heater_mosfet_derating"
part_id = "heater_mosfet"
stress_class = "low-side heater MOSFET"
operating_voltage_v = 13.2
rated_voltage_v = 30.0
operating_current_ma = 1500
rated_current_ma = 5700
operating_power_w = 0.117
rated_power_w = 0.280
estimated_temp_rise_c = 14.63
max_temp_rise_c = 35.0
notes = "AO3400A stress assumes 52 mOhm Rds(on) and continuous 1.5 A heater current."

[[component_deratings]]
id = "heater_tvs_derating"
part_id = "heater_tvs"
stress_class = "heater transient clamp"
operating_voltage_v = 13.2
rated_voltage_v = 18.0
max_voltage_utilization = 0.80
notes = "TVS uses reverse-working-voltage utilization; 18 V clamp is intentionally closer than passive derating limits."

[[component_deratings]]
id = "bulk_cap_voltage_derating"
part_id = "regulator_bulk_caps"
stress_class = "bulk capacitor voltage"
operating_voltage_v = 13.2
rated_voltage_v = 25.0
notes = "The highest-stress bulk capacitor is the 12 V input capacitor."

[[component_deratings]]
id = "decoupling_cap_voltage_derating"
part_id = "decoupling_caps"
stress_class = "logic decoupling capacitor voltage"
operating_voltage_v = 5.1
rated_voltage_v = 50.0
notes = "Worst decoupling exposure is the local +5 V electronics rail."

[[component_deratings]]
id = "adc_supply_derating"
part_id = "adc"
stress_class = "ADS1115 supply and input domain"
operating_voltage_v = 3.3
rated_voltage_v = 5.5
notes = "ADC supply and input handoff stay inside the 3.3 V logic/analog domain."

[[component_deratings]]
id = "analog_mux_supply_derating"
part_id = "optical_mux"
stress_class = "CD74HC4051 supply and analog domain"
operating_voltage_v = 3.3
rated_voltage_v = 6.0
notes = "Analog mux rails and signal range are limited to the +3V3 domain."

[[component_deratings]]
id = "tia_opamp_supply_derating"
part_id = "optical_tia_opamp"
stress_class = "TIA op amp supply and input domain"
operating_voltage_v = 3.3
rated_voltage_v = 5.5
notes = "TLV6001 operates from +3V3 and feeds the ADS1115 input range."

[[component_deratings]]
id = "i2c_pullup_power_derating"
part_id = "resistor_4k7"
stress_class = "I2C pull-up resistor power"
operating_voltage_v = 3.3
rated_voltage_v = 150.0
operating_power_w = 0.0024
rated_power_w = 0.125
notes = "Worst case assumes one I2C line held low continuously through a 4.7k pull-up."

[[component_deratings]]
id = "status_led_resistor_power_derating"
part_id = "resistor_1k"
stress_class = "status LED resistor power"
operating_voltage_v = 3.3
rated_voltage_v = 150.0
operating_power_w = 0.0109
rated_power_w = 0.125
notes = "Worst case assumes a 1k 0805 status LED resistor from +3V3 to ground."

[single_fault_policy]
max_rpn = 120
require_detection_for_severity_at_least = 7
require_hardware_mitigation_for_severity_at_least = 7
require_first_article_for_severity_at_least = 7

[[single_fault_checks]]
id = "heater_mosfet_stuck_on"
subsystem = "heater_drive"
failure_mode = "Low-side heater MOSFET shorted on or gate driver stuck active."
cause = "MOSFET damage, solder bridge, gate-driver fault, or firmware PWM stuck high."
local_effect = "HEATER_P is pulled low and the external heater can energize unexpectedly."
system_effect = "Uncontrolled heater power until supply limit, PTC behavior, or external thermal cutoff interrupts the path."
severity = 10
occurrence = 3
detection = 3
hardware_mitigations = ["heater_resettable_fuse", "inline_thermal_cutoff", "heater_supply_path", "heater_return_path", "heater_tvs"]
firmware_mitigations = ["HEATER_PWM defaults inactive", "firmware heater_enabled interlock", "dashboard exposes heater safety state"]
detection_methods = ["TP_HEATER PWM-off measurement", "TP_PWM idle measurement", "external heater thermal-cutoff verification"]
verification_measurements = ["heater_return_pwm_off", "heater_pwm_idle", "heater_supply_voltage_pwm_off"]
notes = "This is the highest-energy single fault on Rev A and must stay visible in the release package."

[[single_fault_checks]]
id = "heater_terminal_short"
subsystem = "heater_drive"
failure_mode = "External heater connector or cable short."
cause = "Miswired heater, damaged cable, loose terminal strand, or enclosure pinch."
local_effect = "HEATER_SUPPLY current rises above normal operating load."
system_effect = "PTC, bench current limit, and external thermal cutoff must prevent connector/copper overheating."
severity = 9
occurrence = 3
detection = 4
hardware_mitigations = ["heater_resettable_fuse", "heater_output_terminal", "inline_thermal_cutoff", "twelve_v_fused_path"]
firmware_mitigations = ["current-limited first-article bring-up", "heater command validation", "heater safety status reported before enabling"]
detection_methods = ["Bench supply current limit", "PTC/terminal temperature measurement", "TP_HEATER_SUPPLY voltage check"]
verification_measurements = ["heater_supply_voltage_pwm_off", "heater_raw_12v_voltage"]
notes = "The board cannot fully control external cable faults; the release must force protected bring-up and external cutoff installation."

[[single_fault_checks]]
id = "usb_to_heater_domain_short"
subsystem = "power"
failure_mode = "USB/electronics rail accidentally bridged to the 12 V heater domain."
cause = "Assembly bridge, damaged board, or wrong external connection."
local_effect = "VBUS/+5V/+3V3 domain can see excessive voltage or current."
system_effect = "ESP32-S3, USB host, ADC, and logic could be destroyed."
severity = 10
occurrence = 2
detection = 4
hardware_mitigations = ["usb_vbus_schottky", "heater_input_schottky", "vbus_electronics_path", "twelve_v_input_path", "gpio_domain"]
firmware_mitigations = ["USB-only bring-up before 12 V is attached", "firmware does not require heater power for boot"]
detection_methods = ["Power-off resistance checks", "USB current-limited bring-up", "12 V attached only after electronics rail checks pass"]
verification_measurements = ["power_off_vbus_resistance", "power_off_3v3_resistance", "usb_vbus_voltage", "usb_5v_voltage", "usb_3v3_voltage"]
notes = "This catches the high-consequence mixed-domain fault that ERC/DRC cannot reason about semantically."

[[single_fault_checks]]
id = "ldo_overtemperature"
subsystem = "power"
failure_mode = "3.3 V LDO overheats or current-limits under ESP32/Wi-Fi load."
cause = "Unexpected sustained Wi-Fi current, excessive peripheral draw, or poor copper thermal spreading."
local_effect = "+3V3 droops or regulator temperature rises quickly."
system_effect = "Firmware resets, USB disconnects, or analog readings become invalid."
severity = 7
occurrence = 3
detection = 4
hardware_mitigations = ["three_v_three_regulator", "u3_ldo_derating", "three_v_three_distribution", "electrothermal"]
firmware_mitigations = ["avoid sustained high-duty Wi-Fi during first article", "status API exposes firmware identity for tested build"]
detection_methods = ["TP_3V3 voltage check", "regulator case temperature measurement", "electrothermal handoff"]
verification_measurements = ["usb_3v3_voltage"]
notes = "The LDO is intentionally simple for Rev A, so its heat budget must remain a tracked validation fault."

[[single_fault_checks]]
id = "gpio_high_voltage_exposure"
subsystem = "mcu_usb"
failure_mode = "ESP32-S3 GPIO connected to a high-voltage rail or heater net."
cause = "Pin map mistake, schematic/materializer error, or route-source regression."
local_effect = "GPIO absolute maximum rating is exceeded."
system_effect = "MCU damage, USB disconnect, or unsafe heater-control behavior."
severity = 9
occurrence = 2
detection = 3
hardware_mitigations = ["gpio_domain", "heater_gate_driver", "heater_mosfet"]
firmware_mitigations = ["firmware handoff pin-map validation", "Rev A firmware constants generated from handoff"]
detection_methods = ["Machine gpio-domain validation", "firmware CAD handoff tests", "TP_PWM idle check"]
verification_measurements = ["heater_pwm_idle"]
notes = "This ties the CAD pin-net assignment to firmware-facing GPIO assumptions."

[[single_fault_checks]]
id = "adc_mux_overvoltage"
subsystem = "optical_detection"
failure_mode = "ADC/mux/TIA analog path exceeds the 3.3 V domain."
cause = "Wrong part, wrong resistor network, solder bridge, or photodiode/TIA saturation outside expected range."
local_effect = "ADS1115 or analog mux input exceeds allowed common-mode/input range."
system_effect = "Invalid optical readings or damaged analog front end."
severity = 8
occurrence = 2
detection = 4
hardware_mitigations = ["ads1115_input_range", "tia_output_range", "adc_supply_derating", "analog_mux_supply_derating", "tia_opamp_supply_derating"]
firmware_mitigations = ["firmware rejects out-of-range ADC readings before assay interpretation"]
detection_methods = ["TP_ADC first-article check", "one-channel optical calibration", "ADC firmware sanity check"]
verification_measurements = ["analog_adc_idle"]
notes = "The LAMP result path depends on this analog domain staying bounded and measurable."

[[single_fault_checks]]
id = "usb_dp_dn_fault"
subsystem = "mcu_usb"
failure_mode = "USB D+/D- short, excessive skew, missing ESD path, or bad connector assembly."
cause = "Assembly defect, connector damage, or routing-source regression."
local_effect = "USB enumeration fails or stress reaches ESP32-S3 native USB pins."
system_effect = "Board cannot be flashed or debugged over USB."
severity = 6
occurrence = 4
detection = 4
hardware_mitigations = ["usb_esd_protection", "usb_signal_integrity"]
firmware_mitigations = ["firmware artifact package includes flash runbook and build identity"]
detection_methods = ["USB enumeration during bring-up", "CI USB route sanity gate", "visual connector inspection"]
verification_measurements = ["usb_vbus_voltage"]
notes = "Full-speed USB is less safety-critical than the heater path, but it is critical to board recovery and flashing."

[[single_fault_checks]]
id = "i2c_bus_stuck_low"
subsystem = "optical_detection"
failure_mode = "I2C SDA/SCL stuck low or pulled to the wrong rail."
cause = "Solder bridge, failed ADS1115, failed pull-up, or firmware pin mode error."
local_effect = "ADS1115 is unreachable and optical/temperature readings are unavailable."
system_effect = "Firmware must not treat missing sensor data as a valid LAMP result."
severity = 5
occurrence = 4
detection = 3
hardware_mitigations = ["i2c_pullup_power_derating", "gpio_domain"]
firmware_mitigations = ["I2C probe timeout", "dashboard/status exposes sensor fault before test start"]
detection_methods = ["TP_SDA and TP_SCL idle-high checks", "firmware I2C scan"]
verification_measurements = ["i2c_sda_idle", "i2c_scl_idle"]
notes = "This is mostly a functional safety fault: the board should fail closed instead of reporting a false assay result."

[[trace_current_paths]]
id = "vbus_electronics_path"
net = "VBUS"
current_ma = 500
min_width_mm = 0.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "USB input current path to VBUS Schottky and rail bulk capacitance."

[[trace_current_paths]]
id = "five_v_electronics_path"
net = "+5V"
current_ma = 450
min_width_mm = 0.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Post-Schottky electronics 5 V path."

[[trace_current_paths]]
id = "three_v_three_distribution"
net = "+3V3"
current_ma = 300
min_width_mm = 0.50
neckdown_min_width_mm = 0.20
max_neckdown_length_mm = 2.00
allowed_layers = ["F.Cu", "In2.Cu", "B.Cu"]
notes = "3.3 V logic distribution."

[[trace_current_paths]]
id = "twelve_v_input_path"
net = "+12V_RAW"
current_ma = 1500
min_width_mm = 1.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "12 V input from barrel jack to input protection and test point."

[[trace_current_paths]]
id = "twelve_v_fused_path"
net = "+12V"
current_ma = 1500
min_width_mm = 1.50
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Post-Schottky heater supply to the PTC."

[[trace_current_paths]]
id = "heater_supply_path"
net = "HEATER_SUPPLY"
current_ma = 1500
min_width_mm = 2.00
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Fused heater supply to J3."

[[trace_current_paths]]
id = "heater_return_path"
net = "HEATER_P"
current_ma = 1500
min_width_mm = 2.00
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Switched heater return path from J3 to MOSFET drain."

[gpio_domain]
mcu_reference = "U1"
logic_max_v = 3.6
forbidden_high_voltage_nets = ["+12V_RAW", "+12V", "HEATER_SUPPLY", "HEATER_P", "VBUS", "+5V"]
notes = "ESP32-S3 module pins must not directly touch USB VBUS, 5 V, or heater rails."

[[analog_checks]]
id = "ads1115_input_range"
net = "ADC_AIN1"
max_expected_v = 3.3
absolute_max_v = 3.6
notes = "ADS1115 analog input is limited by +3V3 supply in Rev A."

[[analog_checks]]
id = "tia_output_range"
net = "MUX_COM"
max_expected_v = 3.3
absolute_max_v = 3.6
notes = "TIA/mux path must stay inside the ADS1115 and op-amp common-mode/output range."

[[spice_exports]]
id = "power_path_operating_point"
output = "lamp_rev_a_power_path.spice"
notes = "Ngspice handoff for USB-derived electronics rails and heater path first-order operating point."

[usb_signal_integrity]
dp_net = "USB_DP"
dn_net = "USB_DN"
min_width_mm = 0.20
max_route_length_mm = 60.0
max_length_skew_mm = 7.5
max_width_mismatch_mm = 0.05
max_vias_per_net = 2
allowed_layers = ["F.Cu", "B.Cu"]
notes = "Machine-checkable full-speed USB D+/D- route sanity gate. This is not controlled-impedance signoff; it catches obvious pre-fab routing mistakes before first-article USB enumeration."

[[external_analysis_handoffs]]
id = "pdn_power_integrity"
tool_class = "PDN / power integrity"
recommended_tools = ["Ki-PIDA", "Altium PDN Analyzer", "Cadence Sigrity", "Ansys SIwave"]
inputs = ["lamp_rev_a.kicad_pcb", "electrical_validation.toml", "routing_seed.toml", "gerbers"]
exit_criterion = "Voltage drop and current density pass for VBUS, +5V, +3V3, +12V_RAW, +12V, HEATER_SUPPLY, and HEATER_P at the currents in this file."

[[external_analysis_handoffs]]
id = "electrothermal"
tool_class = "thermal / electrothermal"
recommended_tools = ["Cadence Celsius", "Ansys Icepak/SIwave", "PCB-Investigator", "bench thermography"]
inputs = ["heater path copper", "SS34 losses", "AMS1117 losses", "AO3400A losses"]
exit_criterion = "Regulator, input diode, PTC, MOSFET, terminal, and copper remain below touch/material limits at normal heater current."

[[external_analysis_handoffs]]
id = "usb_signal_integrity"
tool_class = "signal integrity"
recommended_tools = ["KiCad impedance calculator", "Saturn PCB Toolkit", "HyperLynx", "oscilloscope eye/edge check"]
inputs = ["USB_DP", "USB_DN", "4-layer stackup"]
exit_criterion = "USB D+/D- routing has controlled-enough geometry for full-speed USB and passes firmware enumeration on first article."

[[manual_first_article_gates]]
id = "unpowered_resistance"
description = "Measure rail-to-GND resistance before applying power."
pass_criterion = "No low-ohm short on VBUS, +5V, +3V3, +12V_RAW, +12V, HEATER_SUPPLY, or HEATER_P."

[[manual_first_article_gates]]
id = "current_limited_usb"
description = "Power USB/VBUS with current limit before attaching 12 V."
pass_criterion = "+5V and +3V3 settle in range and current remains below the USB bring-up limit."

[[manual_first_article_gates]]
id = "current_limited_heater"
description = "Apply 12 V heater power with bench current limit and external thermal cutoff installed."
pass_criterion = "Heater current, MOSFET temperature, diode temperature, and terminal temperature remain inside this validation budget."

[[first_article_measurements]]
id = "power_off_vbus_resistance"
stage = "power_off"
order = 10
test_point = "TP_VBUS"
net = "VBUS"
measurement = "resistance_to_gnd"
pass_criterion = "No low-ohm short to TP_GND before USB power is applied."
notes = "Measure with board unpowered and heater supply disconnected."

[[first_article_measurements]]
id = "power_off_3v3_resistance"
stage = "power_off"
order = 20
test_point = "TP_3V3"
net = "+3V3"
measurement = "resistance_to_gnd"
pass_criterion = "No low-ohm short to TP_GND before USB power is applied."
notes = "This catches reversed/bridged logic rail assembly defects before applying USB power."

[[first_article_measurements]]
id = "usb_vbus_voltage"
stage = "usb_power_only"
order = 30
test_point = "TP_VBUS"
net = "VBUS"
measurement = "voltage_to_gnd"
min_v = 4.75
max_v = 5.25
current_limit_ma = 500
pass_criterion = "VBUS enters the configured voltage window without the supply current limit folding back."
notes = "Use USB/electronics-only power. Do not connect 12 V heater power yet."

[[first_article_measurements]]
id = "usb_5v_voltage"
stage = "usb_power_only"
order = 40
test_point = "TP_5V"
net = "+5V"
measurement = "voltage_to_gnd"
min_v = 4.30
max_v = 5.10
current_limit_ma = 500
pass_criterion = "+5V is present after the VBUS Schottky path and remains below the configured source limit."
notes = "Expected lower than VBUS because Rev A uses a Schottky isolation diode."

[[first_article_measurements]]
id = "usb_3v3_voltage"
stage = "usb_power_only"
order = 50
test_point = "TP_3V3"
net = "+3V3"
measurement = "voltage_to_gnd"
min_v = 3.135
max_v = 3.465
current_limit_ma = 500
pass_criterion = "+3V3 regulator is in range before flashing or enabling heater firmware."
notes = "Stop if AMS1117 temperature rises quickly during this low-current step."

[[first_article_measurements]]
id = "heater_raw_12v_voltage"
stage = "heater_power_present_pwm_off"
order = 60
test_point = "TP_12V"
net = "+12V_RAW"
measurement = "voltage_to_gnd"
min_v = 10.80
max_v = 13.20
current_limit_ma = 3000
pass_criterion = "External 12 V input is in range while firmware keeps heater PWM inactive."
notes = "Bench supply current limit must be at or below the protected heater current budget."

[[first_article_measurements]]
id = "heater_supply_voltage_pwm_off"
stage = "heater_power_present_pwm_off"
order = 70
test_point = "TP_HEATER_SUPPLY"
net = "HEATER_SUPPLY"
measurement = "voltage_to_gnd"
min_v = 10.40
max_v = 13.20
current_limit_ma = 3000
pass_criterion = "Fused heater supply is in range before commanding any heater current."
notes = "External inline thermal cutoff must be installed before this stage."

[[first_article_measurements]]
id = "heater_return_pwm_off"
stage = "heater_power_present_pwm_off"
order = 80
test_point = "TP_HEATER"
net = "HEATER_P"
measurement = "voltage_to_gnd"
min_v = 0.00
max_v = 0.25
current_limit_ma = 3000
pass_criterion = "Low-side return remains off with PWM inactive."
notes = "A high voltage here before firmware enables PWM means the MOSFET path is not fail-closed."

[[first_article_measurements]]
id = "heater_pwm_idle"
stage = "heater_power_present_pwm_off"
order = 90
test_point = "TP_PWM"
net = "HEATER_PWM"
measurement = "logic_level"
min_v = 0.00
max_v = 0.40
current_limit_ma = 500
pass_criterion = "Firmware leaves heater gate drive low during idle and boot."
notes = "Verify before connecting a high-power heater load."

[[first_article_measurements]]
id = "analog_adc_idle"
stage = "firmware_idle"
order = 100
test_point = "TP_ADC"
net = "ADC_AIN1"
measurement = "voltage_to_gnd"
min_v = 0.00
max_v = 3.30
current_limit_ma = 500
pass_criterion = "ADC input stays inside the 3.3 V analog domain."
notes = "Use dark optical state first, then repeat during a one-channel 650 nm emitter check."

[[first_article_measurements]]
id = "i2c_sda_idle"
stage = "firmware_idle"
order = 110
test_point = "TP_SDA"
net = "SDA"
measurement = "logic_level"
min_v = 3.00
max_v = 3.465
current_limit_ma = 500
pass_criterion = "SDA idles high on the 3.3 V domain and is not stuck low."
notes = "A stuck-low bus blocks ADS1115 bring-up."

[[first_article_measurements]]
id = "i2c_scl_idle"
stage = "firmware_idle"
order = 120
test_point = "TP_SCL"
net = "SCL"
measurement = "logic_level"
min_v = 3.00
max_v = 3.465
current_limit_ma = 500
pass_criterion = "SCL idles high on the 3.3 V domain and is not stuck low."
notes = "A stuck-low bus blocks ADS1115 bring-up."
