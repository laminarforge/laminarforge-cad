kibot:
  version: 1

preflight:
  run_erc: true
  run_drc: true
  check_zone_fills: true
  update_xml: true

outputs:
  - name: gerbers
    comment: JLCPCB Gerbers
    type: gerber
    dir: fab/gerbers
    layers:
      - F.Cu
      - In1.Cu
      - In2.Cu
      - B.Cu
      - F.Silkscreen
      - B.Silkscreen
      - F.Mask
      - B.Mask
      - F.Paste
      - Edge.Cuts

  - name: drills
    comment: Excellon drill files
    type: excellon
    dir: fab/drills

  - name: bom
    comment: JLCPCB BOM
    type: bom
    dir: fab

  - name: position
    comment: JLCPCB component placement file
    type: position
    dir: fab

  - name: step
    comment: 3D board export for enclosure interference checks
    type: step
    dir: fab

  - name: render_top
    comment: Top-side render for review
    type: render_3d
    dir: reports
    options:
      ray_tracing: true
      view: top

  - name: render_bottom
    comment: Bottom-side render for review
    type: render_3d
    dir: reports
    options:
      ray_tracing: true
      view: bottom
