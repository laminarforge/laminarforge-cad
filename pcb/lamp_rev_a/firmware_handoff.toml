[package]
name = "lamp_rev_a_firmware_handoff"
ticket = "T-1FEC6E03"
revision = "Rev A"
source_stage = "routed_board_release_export"

[datasheet]
source = "ESP32-S3-WROOM-1 and ESP32-S3-WROOM-1U Datasheet v1.8"
url = "https://documentation.espressif.com/esp32-s3-wroom-1_wroom-1u_datasheet_en.html"
pin_table = "Table 3-1 Pin Definitions"

[mcu]
reference = "U1"
module = "ESP32-S3-WROOM-1-N8"
module_pin_unit = "module pad number"
firmware_pin_unit = "ESP32-S3 SoC GPIO number"

[peripherals]
i2c_sda_net = "SDA"
i2c_scl_net = "SCL"
adc_device = "ADS1115"
adc_i2c_address = "0x48"
adc_input_net = "ADC_AIN1"
mux_common_net = "MUX_COM"
mux_select_nets = ["MUX_S0", "MUX_S1", "MUX_S2"]
heater_pwm_net = "HEATER_PWM"
usb_dn_net = "USB_DN"
usb_dp_net = "USB_DP"
uart_rx_net = "UART_RX"
uart_tx_net = "UART_TX"
boot_net = "ESP_GPIO0"
enable_net = "ESP_EN"
activity_net = "ESP_GPIO_ACT"

notes = [
  "Module pin numbers are physical ESP32-S3-WROOM-1 pad numbers; firmware must use the SoC GPIO numbers in this file.",
  "USB_DN and USB_DP use the ESP32-S3 native USB pins and are not general remappable firmware GPIOs.",
  "ESP_GPIO0 is a boot strap net; firmware can use it only after boot and must not fight the BOOT switch/pull network during reset.",
  "Heater firmware must default HEATER_PWM inactive until TP_12V, TP_HEATER_SUPPLY, and external thermal cutoff checks pass.",
]

[[module_pins]]
module_pin = 3
soc_gpio = -1
net = "ESP_EN"
role = "chip enable/reset"
firmware_direction = "reset-control/test-only"
boot_sensitive = true

[[module_pins]]
module_pin = 13
soc_gpio = 19
net = "USB_DN"
role = "native USB D-"
firmware_direction = "usb"
boot_sensitive = false

[[module_pins]]
module_pin = 14
soc_gpio = 20
net = "USB_DP"
role = "native USB D+"
firmware_direction = "usb"
boot_sensitive = false

[[module_pins]]
