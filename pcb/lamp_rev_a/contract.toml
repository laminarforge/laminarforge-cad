[verification]
required_gates = [
  "contract_check",
  "kicad_erc",
  "kicad_drc",
  "schematic_pcb_parity",
  "bom_jlcpcb_fields",
  "cpl_jlcpcb_fields",
  "gerber_drill_export",
  "step_export",
  "pre_fab_human_review"
]
autorouter_policy = "Autorouting may be used only as a diagnostic after placement; final acceptance is KiCad DRC plus manual review."
simulation_policy = "Use SPICE for power/analog subcircuits, IPC/current calculators for copper sizing, and STEP enclosure interference checks before fabrication."

[manufacturing]
target_vendor = "JLCPCB"
assembly_side = "top"
requires_bom_lcsc = true
requires_cpl = true
requires_gerbers = true
requires_drills = true
requires_drc_clean = true
license_marking = "CERN-OHL-S v2"
