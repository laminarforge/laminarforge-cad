[package]
name = "lamp_rev_a"
ticket = "T-1451163D"
revision = "Rev A"
purpose = "Single-board ESP32-S3 PCBA for the LaminarForge eight-slot LAMP device."
source_stage = "heater_protection_locked"

[board]
physical_board_count = 1
width_mm = 100.0
height_mm = 80.0
thickness_mm = 1.6
layer_count = 4
slot_count = 8
slot_spacing_mm = 12.0
primary_mcu = "ESP32-S3-WROOM-1-N8"
manufacturer_class = "JLCPCB 4-layer standard"

[stackup]
copper_layers = ["F.Cu", "In1.Cu", "In2.Cu", "B.Cu"]
ground_plane_layer = "In1.Cu"
power_plane_layer = "In2.Cu"
outer_copper_oz = 1.0
inner_copper_oz = 0.5
min_clearance_mm = 0.15
min_signal_track_mm = 0.20
min_via_drill_mm = 0.30

[[zones]]
name = "mcu_usb"
purpose = "ESP32-S3 module, USB-C, boot/reset, UART/JTAG/debug"
x_min_mm = 0.0
x_max_mm = 35.0
y_min_mm = 0.0
y_max_mm = 35.0

[[zones]]
name = "analog_optical"
purpose = "LED emitters, photodiodes, mux, ADC, guarded analog routes"
x_min_mm = 5.0
x_max_mm = 96.0
y_min_mm = 45.0
y_max_mm = 75.0

[[zones]]
name = "heater_power"
purpose = "12 V input, heater connector, MOSFET, gate driver, current-return path"
x_min_mm = 60.0
x_max_mm = 100.0
y_min_mm = 0.0
y_max_mm = 35.0

[[zones]]
name = "mechanical_thermal"
purpose = "Heater block mounts, tube geometry, enclosure mounting holes"
x_min_mm = 0.0
x_max_mm = 100.0
y_min_mm = 35.0
y_max_mm = 80.0

[[modules]]
name = "esp32_s3"
status = "required"
owner = "schematic"
deliverable = "ESP32-S3-WROOM module with EN, GPIO0, USB, UART, and test pads."

[[modules]]
name = "usb_programming"
status = "required"
owner = "schematic"
deliverable = "USB-C connector, CC pull-downs, ESD protection, D+/D- routing constraints."

[[modules]]
name = "power"
status = "required"
owner = "schematic"
deliverable = "12 V input protection, 5 V buck, 3.3 V regulator, rail indicators."

[[modules]]
name = "heater_drive"
status = "required"
owner = "schematic"
deliverable = "External heater connector, MOSFET, gate driver, flyback/TVS protection, fuse or current limit."

[[modules]]
name = "temperature_sense"
status = "required"
owner = "schematic"
deliverable = "Thermistor divider and ADC input with test point."

[[modules]]
name = "optical_detection"
status = "required"
owner = "schematic"
deliverable = "Eight optical channels with emitter wavelength, detector, geometry, mux, and ADC path selected from the locked detection mode."

[[modules]]
name = "firmware_debug"
status = "required"
owner = "schematic"
deliverable = "UART/JTAG header and stable firmware pin map."

[[modules]]
name = "manufacturing_test"
status = "required"
owner = "layout"
deliverable = "Board-edge or accessible test points for power, programming, heater, analog, and I2C."

[[rails]]
name = "+12V_RAW"
nominal_voltage_v = 12.0
max_current_ma = 3500
source = "barrel_or_locking_input"
must_have_testpoint = true

[[rails]]
name = "+5V"
nominal_voltage_v = 5.0
max_current_ma = 1200
source = "usb_vbus_via_schottky"
must_have_testpoint = true

[[rails]]
name = "+3V3"
nominal_voltage_v = 3.3
max_current_ma = 700
source = "regulator_from_5v"
must_have_testpoint = true

[[rails]]
name = "HEATER_P"
nominal_voltage_v = 12.0
max_current_ma = 3000
source = "switched_external_heater_output"
must_have_testpoint = true

[[nets]]
