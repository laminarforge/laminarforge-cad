blocks_fabrication = true
reason = "12 V to 5 V regulator symbol, footprint, LCSC part, inductor, and compensation network are not locked."
resolve_with = "Select a JLCPCB-available buck regulator module or IC and add it to pcb/lib before schematic capture."

[[selection_gaps]]
id = "three_v_three_regulator"
module = "power"
blocks_fabrication = true
reason = "5 V to 3.3 V regulator symbol, footprint, LCSC part, and output capacitor requirements are not locked."
resolve_with = "Select a regulator with enough ESP32-S3 Wi-Fi current headroom and add it to pcb/lib."

[[selection_gaps]]
id = "optical_emitters"
module = "optical_detection"
blocks_fabrication = true
reason = "The optical wavelength and emitter package are not locked; current contract says 460 nm, while common LAMP turbidimetry references monitor around 650 nm."
resolve_with = "Choose the actual detection mode first, then select emitter wavelength, viewing angle, current target, footprint, and LCSC part."

[[selection_gaps]]
id = "photodiodes"
module = "optical_detection"
blocks_fabrication = true
reason = "Photodiode package, spectral response, dark current, and bias/readout topology are not selected."
resolve_with = "Select the photodiode and decide whether the readout needs a transimpedance amplifier before the mux/ADC."

[[selection_gaps]]
id = "heater_connector_and_protection"
module = "heater_drive"
blocks_fabrication = true
reason = "External heater connector, fuse/current limit, TVS, and thermal cutoff parts are not locked."
resolve_with = "Select parts around the measured heater current and enclosure wiring method."
