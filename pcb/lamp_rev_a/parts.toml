[package]
name = "lamp_rev_a_parts"
ticket = "T-1451163D"
revision = "Rev A"
source_stage = "optical_architecture_locked"

[schematic]
root_file = "lamp_rev_a.kicad_sch"
symbol_library = "../lib/lcsc.kicad_sym"
footprint_library = "../lib/lcsc.pretty"

[[blocks]]
name = "mcu_usb"
title = "MCU / USB / Programming"
modules = ["esp32_s3", "usb_programming", "firmware_debug"]
required_nets = ["+3V3", "GND", "USB_DP", "USB_DN", "USB_CC1", "USB_CC2", "VBUS", "ESP_EN", "ESP_GPIO0", "UART_TX", "UART_RX"]

[[blocks]]
name = "power"
title = "Power"
modules = ["power"]
required_nets = ["+12V_RAW", "+5V", "+3V3", "GND", "VBUS"]

[[blocks]]
name = "heater_drive"
title = "Heater Drive"
modules = ["heater_drive"]
required_nets = ["+12V_RAW", "+12V", "HEATER_SUPPLY", "HEATER_P", "HEATER_PWM", "GATE_DRV", "MOSFET_GATE", "GND"]

[[blocks]]
name = "temperature_sense"
title = "Temperature Sense"
modules = ["temperature_sense"]
required_nets = ["+3V3", "ADC_AIN1", "GND"]

[[blocks]]
name = "optical_detection"
title = "Optical Detection"
modules = ["optical_detection"]
required_nets = ["+3V3", "SDA", "SCL", "MUX_COM", "MUX_S0", "MUX_S1", "MUX_S2", "ADC_AIN1"]

[[blocks]]
name = "manufacturing_test"
title = "Manufacturing Test"
modules = ["manufacturing_test"]
required_nets = ["GND", "+12V_RAW", "+5V", "+3V3", "HEATER_SUPPLY", "HEATER_P", "HEATER_PWM", "ADC_AIN1", "MUX_COM", "SDA", "SCL", "ESP_EN", "ESP_GPIO0", "UART_TX", "UART_RX", "VBUS"]

