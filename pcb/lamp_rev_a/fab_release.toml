[package]
name = "lamp_rev_a_fab_release"
ticket = "T-467872EC"
revision = "Rev A"
source_stage = "upload_bundle_release_export"

[toolchain]
min_kicad_major = 10

[inputs]
board = "pcb/lamp_rev_a/lamp_rev_a.kicad_pcb"
schematic = "pcb/lamp_rev_a/lamp_rev_a.kicad_sch"
contract = "pcb/lamp_rev_a/contract.toml"
parts = "pcb/lamp_rev_a/parts.toml"
placement = "pcb/lamp_rev_a/placement.toml"
pin_nets = "pcb/lamp_rev_a/pin_nets.toml"
firmware_handoff = "pcb/lamp_rev_a/firmware_handoff.toml"
electrical_validation = "pcb/lamp_rev_a/electrical_validation.toml"

[outputs]
root_dir = "pcb/lamp_rev_a/fab_release"
reports_dir = "reports"
gerbers_dir = "gerbers"
drills_dir = "drills"
assembly_dir = "assembly"
review_dir = "review"
bundles_dir = "bundles"
drc_report = "reports/drc.json"
erc_report = "reports/erc.json"
drill_report = "reports/drill_report.txt"
bom_file = "assembly/bom_jlcpcb.csv"
cpl_file = "assembly/cpl_jlcpcb.csv"
manual_file = "assembly/manual_install_parts.csv"
position_file = "assembly/kicad_position_front.csv"
step_file = "review/lamp_rev_a_board.step"
order_audit_file = "review/order_audit.md"
bringup_file = "review/bringup_checklist.md"
firmware_handoff_file = "review/firmware_handoff.md"
electrical_validation_file = "review/electrical_validation.md"
electrical_validation_gates_file = "review/electrical_validation_gates.csv"
spice_netlist_file = "review/lamp_rev_a_power_path.spice"
simulation_handoff_file = "review/simulation_handoff.md"
simulation_inputs_file = "review/simulation_inputs.csv"
pdn_current_paths_file = "review/pdn_current_paths.csv"
thermal_power_file = "review/thermal_power_budget.csv"
first_article_measurements_file = "review/first_article_measurements.csv"
component_derating_file = "review/component_derating.csv"
fault_fmea_file = "review/fault_fmea.csv"
emc_esd_file = "review/emc_esd_precompliance.csv"
i2c_bus_file = "review/i2c_bus_validation.csv"
heater_protection_file = "review/heater_protection_coordination.csv"
startup_safety_file = "review/startup_safety.csv"
manufacturing_test_file = "review/manufacturing_test_coverage.csv"
calibration_readiness_file = "review/calibration_readiness.csv"
validation_traceability_file = "review/validation_traceability.csv"
pdn_dc_simulation_file = "review/pdn_dc_simulation.csv"
thermal_margin_simulation_file = "review/thermal_margin_simulation.csv"
heater_pwm_transient_netlist_file = "review/lamp_rev_a_heater_pwm_transient.spice"
heater_pwm_transient_file = "review/heater_pwm_transient_simulation.csv"
heater_thermal_transient_file = "review/heater_thermal_transient_simulation.csv"
usb_inrush_startup_file = "review/usb_inrush_startup_simulation.csv"
rail_load_step_netlist_file = "review/lamp_rev_a_rail_load_step.spice"
rail_load_step_file = "review/rail_load_step_simulation.csv"
analog_front_end_netlist_file = "review/lamp_rev_a_analog_front_end.spice"
analog_front_end_file = "review/analog_front_end_simulation.csv"
optical_crosstalk_file = "review/optical_crosstalk_validation.csv"
optical_noise_margin_file = "review/optical_noise_margin.csv"
thermistor_adc_transfer_file = "review/thermistor_adc_transfer.csv"
bundle_checksums_file = "review/upload_bundle_checksums.sha256"
manifest_file = "release_manifest.txt"
fabrication_bundle = "bundles/lamp_rev_a_jlcpcb_fabrication.zip"
assembly_bundle = "bundles/lamp_rev_a_jlcpcb_assembly.zip"
review_bundle = "bundles/lamp_rev_a_review_package.zip"
source_bundle = "bundles/lamp_rev_a_source_snapshot.zip"

[assembly]
machine_side = "top"
manual_part_ids = [
  "dc_input_jack",
  "heater_output_terminal",
]
require_cpl_matches_kicad_position = true

[review]
remaining_gates = [
  "Human KiCad layout review of the routed board, especially USB, heater current path, and analog optical front end.",
  "Schematic completion/parity review; the current KiCad schematic is still an architecture shell.",
  "Heater current, copper temperature-rise, fuse trip-curve, and external thermal-cutoff bench validation.",
  "Run the electrical validation report through external PDN/electrothermal tooling before treating Rev A as a production design.",
  "Optical one-channel bench calibration for 650 nm turbidimetry signal slope, negative-control stability, and detector saturation margin.",
  "Enclosure/connector fit check against the Rev A mechanical assembly before ordering assembled boards.",
]

[bringup]
usb_power_limit_ma = 500
heater_power_limit_ma = 3000
required_test_points = [
  "TP_GND",
  "TP_VBUS",
  "TP_5V",
  "TP_3V3",
  "TP_12V",
  "TP_HEATER",
  "TP_HEATER_SUPPLY",
  "TP_PWM",
  "TP_ADC",
  "TP_MUX",
  "TP_SDA",
  "TP_SCL",
  "TP_EN",
  "TP_BOOT",
  "TP_TX",
  "TP_RX",
]

[source_snapshot]
files = [
  "pcb/lamp_rev_a/contract.toml",
  "pcb/lamp_rev_a/parts.toml",
  "pcb/lamp_rev_a/power_architecture.toml",
  "pcb/lamp_rev_a/optical_architecture.toml",
  "pcb/lamp_rev_a/placement.toml",
  "pcb/lamp_rev_a/pin_nets.toml",
  "pcb/lamp_rev_a/firmware_handoff.toml",
  "pcb/lamp_rev_a/electrical_validation.toml",
  "pcb/lamp_rev_a/routing_plan.toml",
  "pcb/lamp_rev_a/routing_seed.toml",
  "pcb/lamp_rev_a/copper_zones.toml",
  "pcb/lamp_rev_a/fab_release.toml",
  "pcb/lamp_rev_a/lamp_rev_a.kicad_sch",
  "pcb/lamp_rev_a/lamp_rev_a.kicad_pcb",
  "pcb/lamp_rev_a/lamp_rev_a.kicad_pro",
  "pcb/lamp_rev_a/lamp_rev_a.kicad_dru",
  "pcb/lamp_rev_a/sym-lib-table",
  "pcb/lamp_rev_a/fp-lib-table",
  "pcb/lamp_rev_a/kibot.yaml",
]

[gerbers]
layers = [
  "F.Cu",
  "In1.Cu",
  "In2.Cu",
  "B.Cu",
  "F.SilkS",
  "B.SilkS",
  "F.Mask",
  "B.Mask",
  "F.Paste",
  "Edge.Cuts",
]
check_zones = true
precision = 6
use_board_plot_params = false

[drills]
format = "excellon"
units = "mm"
origin = "absolute"
zeros_format = "decimal"
oval_format = "alternate"
separate_th = true
generate_map = true
generate_report = true

[position]
side = "front"
format = "csv"
units = "mm"
smd_only = true
exclude_dnp = true

[step]
enabled = true
board_only = true
force = true

[gates]
allow_kicad_self_zone_unconnected = true
max_physical_drc_violations = 0
max_real_unconnected_items = 0
max_erc_violations = 0
