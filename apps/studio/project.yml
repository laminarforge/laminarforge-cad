name: LaminarForgeStudio
options:
  deploymentTarget:
    macOS: '12.0'
settings:
  base:
    DEVELOPMENT_TEAM: M3C97KFGK9
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  LaminarForgeStudio:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: LaminarForge Studio
        PRODUCT_BUNDLE_IDENTIFIER: com.laminarforge.studio
        EXECUTABLE_NAME: laminarforge_studio
        INFOPLIST_FILE: macos/Info.plist
        CODE_SIGN_ENTITLEMENTS: macos/Studio.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: LaminarForge Studio Mac App Store
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        DEBUG_INFORMATION_FORMAT: dwarf
        SKIP_INSTALL: NO
    sources:
      - path: macos/Studio.icns
        buildPhase: resources
    postBuildScripts:
      - name: Install verified Rust executable
        script: |
          set -eu
          test -x "${SRCROOT}/dist/laminarforge_studio"
          cd "${SRCROOT}/dist"
          /usr/bin/shasum -a 256 -c laminarforge_studio.sha256
          /bin/mkdir -p "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          /bin/cp "${SRCROOT}/dist/laminarforge_studio" "${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
        basedOnDependencyAnalysis: false
schemes:
  LaminarForgeStudio:
    build:
      targets:
        LaminarForgeStudio: all
    archive:
      config: Release
